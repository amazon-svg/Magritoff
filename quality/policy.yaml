schemaVersion: "1.0"
policy: advisory
reportsDirectory: quality-reports

context:
  architectureSources:
    - docs/REGLES_ARCHITECTURE.md
    - docs/CONVENTION_GIT.md
    - docs/project-context.md
    - ARCHITECTURE.md
    - _bmad-output/planning-artifacts/architecture.md
  functionalSpecGlob: quality/specs/**/*.spec.yaml
  uxSources:
    - .design-handoff/README.md
    - _bmad-output/planning-artifacts/ux-design-specification.md
    - _bmad-output/planning-artifacts/ux-design-ecom-boutique-2026-07-07.md
    - docs/UX_GUIDELINES.md

checks:
  repository-secrets:
    title: Vérifier l'absence de fichiers locaux ou secrets versionnés
    command: [pnpm, quality:secrets]
    severity: critical
  build:
    title: Construire l'application de production
    command: [pnpm, build]
    severity: critical
  specs-format:
    title: Valider le format des spécifications fonctionnelles
    command: [pnpm, specs:validate]
    severity: major
  specs-presence:
    title: Vérifier la présence de spécifications fonctionnelles importées
    command: [pnpm, specs:validate]
    severity: major
    requiresSpecFiles: true
  typecheck:
    title: Vérifier le typage du socle modulaire
    command: [pnpm, typecheck]
    severity: critical
  architecture-tests:
    title: Exécuter les tests de frontières architecturales
    command: [pnpm, test:architecture]
    severity: critical
  generated-api-types:
    title: Vérifier la dérive entre OpenAPI et les types générés
    command: [pnpm, gen:api:check]
    severity: critical
  contract-tests:
    title: Exécuter les tests de contrat API
    command: [pnpm, test:contract]
    severity: critical
  complete-tests:
    title: Exécuter la suite Vitest complète
    command: [pnpm, test]
    severity: critical
  coverage:
    title: Mesurer la couverture du code
    command: [pnpm, test:coverage]
    severity: major
  accessibility:
    title: Scanner les routes avec axe-core
    command: [pnpm, a11y:scan]
    severity: critical
    requiresUrl:
      environment: A11Y_BASE_URL
      default: http://localhost:5177
  browser-e2e:
    title: Exécuter les parcours Playwright reproductibles
    command: [pnpm, test:e2e:quality]
    severity: critical
    enabledByEnvironment: QUALITY_RUN_E2E
    requiresUrl:
      environment: E2E_BASE_URL
      default: http://localhost:5177
  browser-e2e-staging:
    title: Exécuter tous les parcours Playwright sur la recette préparée
    command: [pnpm, test:e2e:staging]
    severity: critical
    enabledByEnvironment: QUALITY_RUN_STAGING_E2E
    requiresEnvironment:
      - SUPABASE_URL
      - SUPABASE_ANON_KEY
      - SUPABASE_SERVICE_ROLE_KEY
      - E2E_QA_EMAIL
      - E2E_QA_PASSWORD
      - E2E_ADMIN_PASSWORD
    requiresUrl:
      environment: E2E_BASE_URL
      default: http://localhost:5177

agents:
  architecture:
    title: Architecture
    profile: quality/agents/architecture.md
    checks:
      diff: [repository-secrets, typecheck, build, architecture-tests, generated-api-types]
      module: [repository-secrets, typecheck, build, architecture-tests, generated-api-types]
      full: [repository-secrets, typecheck, build, architecture-tests, generated-api-types]
  api:
    title: API
    profile: quality/agents/api.md
    checks:
      diff: [generated-api-types, contract-tests]
      module: [generated-api-types, contract-tests]
      full: [generated-api-types, contract-tests]
  functional:
    title: Conformité fonctionnelle
    profile: quality/agents/functional.md
    checks:
      diff: [specs-format, specs-presence]
      module: [specs-format, specs-presence, complete-tests]
      full: [specs-format, specs-presence, complete-tests]
  ux:
    title: Expérience utilisateur
    profile: quality/agents/ux.md
    checks:
      diff: [accessibility, browser-e2e]
      module: [accessibility, browser-e2e, browser-e2e-staging]
      full: [accessibility, browser-e2e, browser-e2e-staging]
  test-quality:
    title: Qualité des tests
    profile: quality/agents/test-quality.md
    checks:
      diff: [repository-secrets, specs-format, specs-presence, contract-tests]
      module: [repository-secrets, specs-format, specs-presence, complete-tests, coverage]
      full: [repository-secrets, specs-format, specs-presence, complete-tests, coverage]
