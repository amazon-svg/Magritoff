<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Pilotage projet — Magrit</title>
  <style>
    :root {
      --bg: #09111f;
      --panel: #101b2d;
      --panel-2: #152238;
      --line: #263650;
      --text: #edf3ff;
      --muted: #9cacC4;
      --accent: #67e8f9;
      --accent-2: #a78bfa;
      --good: #4ade80;
      --warn: #fbbf24;
      --bad: #fb7185;
      --radius: 14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at top left, #152442 0, var(--bg) 34rem); color: var(--text); min-height: 100vh; }
    button, input, select { font: inherit; }
    a { color: inherit; }
    .shell { max-width: 1680px; margin: 0 auto; padding: 28px; }
    .header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 22px; }
    .eyebrow { color: var(--accent); font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; }
    h1 { font-size: clamp(1.8rem, 4vw, 3.2rem); margin: 5px 0 7px; letter-spacing: -.04em; }
    .subtitle { color: var(--muted); margin: 0; max-width: 780px; line-height: 1.55; }
    .source-pill { border: 1px solid var(--line); background: #0c1728cc; border-radius: 999px; padding: 9px 13px; color: var(--muted); white-space: nowrap; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .tab { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
    .tab[aria-selected="true"] { background: var(--accent); color: #05202b; border-color: transparent; font-weight: 800; }
    .view[hidden] { display: none; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .metric { padding: 17px; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, #132139, #0e192a); }
    .metric strong { display: block; font-size: 1.75rem; margin-bottom: 4px; }
    .metric span { color: var(--muted); font-size: .82rem; }
    .grid-2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, .8fr); gap: 16px; align-items: start; }
    .panel { border: 1px solid var(--line); background: #0e192af0; border-radius: var(--radius); padding: 18px; min-width: 0; }
    .panel h2 { margin: 0 0 14px; font-size: 1.02rem; }
    .bars { display: grid; gap: 11px; }
    .bar-row { display: grid; grid-template-columns: 130px 1fr 42px; gap: 10px; align-items: center; color: var(--muted); font-size: .82rem; }
    .bar-track { height: 10px; background: #07101e; border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
    .bar-count { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
    .attention { display: grid; gap: 10px; }
    .attention-item { padding: 12px; background: var(--panel-2); border-left: 3px solid var(--warn); border-radius: 8px; }
    .attention-item strong { display: block; margin-bottom: 4px; }
    .attention-item span { color: var(--muted); font-size: .82rem; }
    .filters { display: grid; grid-template-columns: minmax(220px, 1.4fr) repeat(3, minmax(150px, .7fr)); gap: 10px; margin-bottom: 15px; }
    .control { width: 100%; background: #0b1525; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 10px 12px; }
    .kanban { display: grid; grid-template-columns: repeat(8, minmax(265px, 1fr)); gap: 12px; overflow-x: auto; padding: 2px 2px 14px; align-items: start; }
    .column { background: #0c1727; border: 1px solid var(--line); border-radius: 13px; min-height: 230px; max-height: 70vh; display: flex; flex-direction: column; }
    .column-head { display: flex; justify-content: space-between; align-items: center; padding: 13px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #0c1727; z-index: 2; border-radius: 13px 13px 0 0; }
    .column-head strong { font-size: .82rem; text-transform: uppercase; letter-spacing: .06em; }
    .badge { min-width: 25px; text-align: center; padding: 3px 7px; border-radius: 99px; background: #23334d; color: var(--muted); font-size: .75rem; }
    .cards { padding: 9px; overflow-y: auto; display: grid; gap: 8px; }
    .card { display: block; text-decoration: none; background: var(--panel-2); border: 1px solid #2a3b58; padding: 11px; border-radius: 10px; transition: transform .12s, border-color .12s; }
    .card:hover { transform: translateY(-1px); border-color: var(--accent); }
    .card-id { font-size: .7rem; color: var(--accent); font-weight: 800; letter-spacing: .04em; }
    .card-title { margin: 5px 0 9px; line-height: 1.3; font-size: .9rem; }
    .card-meta { display: flex; gap: 5px; flex-wrap: wrap; }
    .tag { color: var(--muted); background: #0a1423; border-radius: 6px; padding: 3px 6px; font-size: .68rem; }
    .tag.bad { color: #fecdd3; background: #4c1826; }
    .empty { color: var(--muted); font-size: .8rem; padding: 10px; }
    .tree { display: grid; gap: 11px; }
    details { border: 1px solid var(--line); background: var(--panel); border-radius: 11px; }
    summary { cursor: pointer; padding: 13px; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
    summary::-webkit-details-marker { display: none; }
    .tree-body { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; }
    .feature { background: #0a1525; border-radius: 9px; padding: 11px; }
    .feature-title { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
    .story-list { color: var(--muted); font-size: .8rem; display: flex; gap: 7px; flex-wrap: wrap; }
    .story-link { padding: 4px 7px; background: #132139; border-radius: 6px; text-decoration: none; }
    .decision-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
    .decision-list { display: grid; gap: 9px; }
    .decision-card { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 13px; }
    .decision-card h3 { font-size: .92rem; margin: 5px 0 8px; }
    .decision-card p { color: var(--muted); font-size: .82rem; line-height: 1.45; margin: 0; }
    .decision-card footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; color: var(--muted); font-size: .72rem; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-right: 6px; }
    .document-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 11px; }
    .document-card { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 13px; }
    .document-card h3 { margin: 7px 0 10px; font-size: .92rem; line-height: 1.35; }
    .document-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .document-footer { display: flex; justify-content: space-between; gap: 9px; color: var(--muted); font-size: .74rem; }
    .status-draft { color: var(--muted); }
    .status-review { color: var(--warn); }
    .status-done { color: var(--good); }
    .muted { color: var(--muted); }
    @media (max-width: 1050px) { .metrics { grid-template-columns: repeat(3, 1fr); } .grid-2, .decision-layout { grid-template-columns: 1fr; } .filters { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 640px) { .shell { padding: 17px; } .header { align-items: start; flex-direction: column; } .metrics { grid-template-columns: repeat(2, 1fr); } .filters { grid-template-columns: 1fr; } }
  </style>
</head>

SIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/BCP-5.md","summary":"Un acheteur qui voit « Brouillon » sur la commande qu'il vient de passer en conclut qu'elle n'est pas partie : il la repasse, ou il appelle. L'atelier, de son côté, lit un autre mot pour le même état et ne sait pas de quoi parle l'acheteur au téléphone. Le coût du défaut est là : des doublons, des appels, et une boutique qui n'inspire pas confiance au premie"},{"id":"BCP-5/6-fix","title":"Correctif post-recette — conflits de commande et fiche produit","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"verified","lifecycleStatus":null,"owner":"unassigned","dependencies":["BCP-5","BCP-6"],"decisions":[],"sourcePath":"project/backlog/stories/BCP-5_6-fix.md","summary":"Quand l'atelier valide une commande à la seconde où l'acheteur l'annule, l'un des deux reçoit un refus. Ce refus est normal ; ce qui ne l'est pas, c'est qu'il s'affiche sous forme de code technique avec un identifiant interne. L'acheteur ne comprend rien, croit à une panne, et appelle. Pire : si la liste ne se recharge pas après le refus, il continue d'agir "},{"id":"BCP-6","title":"BCP-6 — Console propre sur la boutique","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/BCP-6.md","summary":"Une console saturée d'avertissements permanents ne sert plus à rien : le vrai défaut, le jour où il apparaît, se noie dans le bruit et personne ne le voit. C'est exactement ce qui s'est produit sur la boucle d'appels de BCP-6b, mesurée en navigateur et invisible pour les tests. Le second volet, les descriptions manquantes sur les fenêtres et les tiroirs, n'e"},{"id":"BCP-6b","title":"BCP-6b — Fin de la boucle d'appels session et catalogue","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/BCP-6b.md","summary":"Une boutique laissée ouverte sur un poste d'accueil émettait deux appels toutes les cinq secondes, dont un rechargement complet du catalogue. Multiplié par le nombre d'onglets ouverts che"},{"id":"BCP-9","title":"BCP-9 — Libellé du bouton de compte acheteur","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/BCP-9.md","summary":"Le défaut ne coûtait pas une vente : il coûtait la crédibilité de la boutique auprès de l'acheteur qui l'entend plutôt qu'il ne la voit. « Compte de acheteur », puis « Compte de Aline », c'est une faute d'élision répétée à chaque écran — le signe d'une interface assemblée par concaténation, pas écrite. La correction est de l'ordre du soin, et le soin se rema"},{"id":"E_A11Y.shop-pills-and-drawer","title":"E_A11Y.shop-pills-and-drawer — aria-pressed pill-all + aria-modal drawer","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E_A11Y.shop-pills-and-drawer.md","summary":"Un acheteur qui utilise un lecteur d'écran filtre à l'aveugle : rien ne lui dit si « Tout » est actif ou non, et rien ne lui signale qu'il vient d'entrer dans un panneau modal. Il ne se trompe pas de produit, il perd du temps et finit par appeler. Pour une boutique professionnelle, dont les acheteurs sont des salariés qui commandent dans le cadre de leur tra"},{"id":"E_CART.persist-localstorage","title":"E_CART.persist-localstorage — Persistance CartContext localStorage par shop_slug","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E_CART.persist-localstorage.md","summary":"Reconstituer un panier de produits configurés, c'est refaire les choix de format, de support et de quantité un par un. Un acheteur qui perd son panier ne recommence pas : il reporte, ou il appelle. Le panier perdu est le point où l'achat s'arrête, et il s'arrête d'autant plus facilement que la boutique est un outil qu'on utilise entre deux autres tâches."},{"id":"E_DEVTOOLS.passer-commande-modal","title":"E_DEVTOOLS.passer-commande-modal — Remplacer confirm() native par AlertDialog shadcn","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E_DEVTOOLS.passer-commande-modal.md","summary":"Une boîte native n'est pas à la charte, ne dit pas ce qu'on s'apprête à engager, et sort l'acheteur de la boutique le temps d'un clic. Surtout, elle bloque la page : aucun outil de recette automatisée ne peut la franchir. Ce que cela coûtait : le chemin d'achat le plus important de la boutique — passer commande — ne pouvait pas être vérifié de bout en bout a"},{"id":"E_DEVTOOLS.shop-only-account","title":"E_DEVTOOLS.shop-only-account — Voie bypass auth Resend dev OU seed shop_only pré-activé","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E_DEVTOOLS.shop-only-account.md","summary":"Historique. La valeur recherchée — ne pas laisser une campagne de recette bloquée par une dette d'outillage — est réelle et reste valable, mais elle n'a plus besoin de cette story pour être servie."},{"id":"E_OBS.mockup-cache-header","title":"E_OBS.mockup-cache-header — X-Mockup-Cache CORS-expose ou tracing","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E_OBS.mockup-cache-header.md","summary":"Historique, et modeste — la source la classait elle-même en priorité basse et « pas bloquant démo ». La valeur recherchée était de pouvoir mesurer le taux de réutilisation du cache de prévisualisations sans outil séparé, au service d'un objectif de temps de réponse. Cette mesure relève désormais de la supervision générale (E7.3), pas d'un correctif ponctuel "},{"id":"E_OVERLAY.fix-TF59","title":"E_OVERLAY.fix-TF59 — Réinitialisation overlay boutique + premier POST clariprint-quote","type":"story","epic":"EPIC-E1","feature":"FEAT-E1-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E_ROOT.fix-PublicShop-hooks"],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/E_OVERLAY.fix-TF59.md","summary":"Le panneau de configuration est le dernier écran avant la mise au panier : c'est là que l'acheteur choisit son papier, sa finition, sa quantité, et qu'il voit ce que ça coûte. S'il s'ouvre à"},{"id":"E_ROOT.fix-PublicShop-hooks","title":"E_ROOT.fix-PublicShop-hooks — Vérifier régression Rules of Hooks dans PublicShop (post S-FIX-5)","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E_OVERLAY.fix-TF59"],"decisions":[],"sourcePath":"project/backlog/stories/E_ROOT.fix-PublicShop-hooks.md","summary":"Quand la page boutique se remonte toute seule à cause d'une erreur, l'acheteur perd ce qu'il était en train de faire : la fenêtre de configuration repart d'un état vide et la première demande de chiffrage n'est jamais envoyée. L'acheteur voit un produit sans prix, ou un configurateur qui ne répond pas. Ce que cela coûtait : la fonction centrale de la boutiqu"},{"id":"E1.1","title":"E1.1 — Devis textuel simple → calcul de prix","type":"story","epic":"EPIC-E1","feature":"FEAT-E1-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/E1.1.md","summary":"C'est le cœur de la proposition Magrit : la phrase devient un devis. Tant que ce chemin n'est pas fiable, aucune autre fonctionnalité de l'application n'a de raison d'exister — le reste du produit n'est que de l'habillage autour de ce calcul. Pour l'imprimeur, chaque demande chiffrée sans intervention du deviseur est une demande qui ne consomme pas d'atelier"},{"id":"E1.2","title":"E1.2 — API monoproduit dédiée","type":"story","epic":"EPIC-E1","feature":"FEAT-E1-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E1.1"],"decisions":[],"sourcePath":"project/backlog/stories/E1.2.md","summary":"Une bonne part des chiffrages de Magrit part d'un produit déjà connu : une carte de catalogue, une ligne de panier qu'on reconfigure, un renouvellement de commande. Dans ces cas, faire retraverser à la demande l'étape qui devine le type de produit ne sert à rien et se paie en attente. Or le temps de réponse n'est pas un détail de confort ici : il conditionne"},{"id":"E1.3","title":"E1.3 — Validation sortie LLM par schéma JSON strict","type":"story","epic":"EPIC-E1","feature":"FEAT-E1-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E1.3.md","summary":"Un modèle qui se trompe sur un mot produit une phrase bancale ; un modèle qui se trompe sur une structure produit un devis faux. Entre les deux, il n'y a que ce contrôle. Magrit fait transiter par le modèle ce qui détermine le prix : le produit retenu, sa configuration, ses quantités. Sans barrière de forme à la réception, une clé renommée ou un nombre rendu"},{"id":"E1.4","title":"E1.4 — Parallélisation multiproduit","type":"story","epic":"EPIC-E1","feature":"FEAT-E1-UNCLASSIFIED","specStatus":"contradictory","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E1.4.md","summary":"Une demande réelle d'imprimeur porte rarement sur un seul article : un kit d'ouverture de magasin, c'est une affiche, des flyers, un kakémono et des cartes. Si chaque ligne attend que la précédente soit chiffrée, le devis complet devient inutilisable en conversation — cinq produits à trois secondes font quin"},{"id":"E1.5","title":"E1.5 — Interrogation Clariprint depuis Excel","type":"story","epic":"EPIC-E1","feature":"FEAT-E1-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E1.5.md","summary":"Che"},{"id":"E1.fix-TF51","title":"Fix TF-51 — PricingPanel atelier rend le badge Prix marché","type":"story","epic":"EPIC-E1","feature":"FEAT-E1-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B3","PD-2026-10-01-B4"],"sourcePath":"project/backlog/stories/E1.fix-TF51.md","summary":"Un prix sans son origine est un prix qu'on croit ferme. Quand Clariprint n'a pas répondu, Magrit affiche malgré tout un montant — c'est voulu, c'est le prix marché, et c'est ce qui permet de ne jamais laisser un écran vide. Mais si rien ne distingue ce montant d'un prix réel, l'imprimeur le reprend tel quel dans sa proposition et découvre l'écart une fois la"},{"id":"E1.WM1","title":"Backlog HStudio Copilot + documentation frontière technique HStudio/Magrit","type":"story","epic":"EPIC-E1","feature":"FEAT-E1-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E1.WM2","E1.WM3"],"decisions":["PD-2026-10-05-HOPESTUDIO"],"sourcePath":"project/backlog/stories/E1.WM1.md","summary":"Deux équipes, deux entreprises, deux dépôts, un seul produit perçu par l'utilisateur : sans frontière écrite, chacune suppose que l'autre couvre ce qui manque, et personne ne le couvre. Le coût ne se voit pas en réunion, il se voit au refactoring — on réécrit du côté Magrit ce que HStudio exposait déjà, ou on bâtit sur une donnée qui n'était pas censée être "},{"id":"E1.WM2","title":"POC intégration HStudio dans Magrit via API Copilot","type":"story","epic":"EPIC-E1","feature":"FEAT-E1-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E1.WM1"],"decisions":["PD-2026-10-05-HOPESTUDIO"],"sourcePath":"project/backlog/stories/E1.WM2.md","summary":"La question tranchée en réunion n'est pas technique, elle est d'architecture commerciale : Magrit s'adresse-t-il au moteur de prix, ou à l'outil métier qui l'enveloppe ? Passer par HStudio apporte en prime ce que l'appel direct ne donne pas — les patrons de découpe et la vue en trois dimensions, c'est-à-dire ce qui permet de montrer un produit avant de le fa"},{"id":"E1.WM3","title":"Refactoring POC Magrit post-stabilisation frontière HStudio","type":"story","epic":"EPIC-E1","feature":"FEAT-E1-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E1.WM1","E1.WM2"],"decisions":["PD-2026-10-05-HOPESTUDIO"],"sourcePath":"project/backlog/stories/E1.WM3.md","summary":"Un prototype laisse derrière lui des raccourcis assumés sur le moment. Tant qu'ils restent, Magrit dépend de deux choses au lieu d'une : l'interface HStudio sur laquelle on a décidé de s'appuyer, et le moteur Clariprint auquel on parle encore en douce. Chaque évolution de Clariprint casse alors Magrit sans prévenir, et la frontière de responsabilité écrite d"},{"id":"E10.0","title":"E10.0 — Socle API-first : contrats, conventions et découpage modulaire (à lire avant toute story E10)","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E10.0.md","summary":"Magrit ne vend pas seulement une interface, il vend une brique intégrable. Studio attend le contrat de la gestion commerciale pour brancher ses données : tant qu'il n'existe pas, l'intégration reste au prototype et le partenaire est bloqué. Un module auquel on n'accède qu'en React n'est pas intégrable — Studio n'a pas de client React. Le contrat n'est donc p"},{"id":"E10.1","title":"E10.1 — Espace Projets : conteneur de travail en remplacement du panier","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-PROJECTS","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.4"],"decisions":[],"sourcePath":"project/backlog/stories/E10.1.md","summary":"Un commercial d'imprimerie mène plusieurs affaires en parallèle et revient sur chacune pendant des jours. Le panier d'e-commerce ne sait faire ni l'un ni l'autre : il ne se nomme pas, ne se retrouve pas, ne se reprend pas, et il se vide. Résultat, le chiffrage se refait ou se perd, et le travail déjà fait avec Clariprint est jeté. Le projet transforme une ex"},{"id":"E10.10","title":"E10.10 — Affichage optionnel des remises sur le document de devis","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.9"],"decisions":[],"sourcePath":"project/backlog/stories/E10.10.md","summary":"Montrer une remise, c'est en reconnaître l'existence et s'exposer à devoir la refaire au prochain devis. La masquer, c'est présenter un prix net sans justifier d'où il vient. Les deux positions sont légitimes selon le client et selon la négociation, et aucune ne doit être imposée par l'outil. Le cas le plus sensible est la remise négative — une vente au-dess"},{"id":"E10.10b-1","title":"E10.10b-1 — Lecture des devis dans le portail client","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E10.10b-1.md","summary":"Aujourd'hui une offre vit dans une boîte mail : elle se perd, elle se retrouve en double, et la version qui fait foi est celle que chacun croit avoir. Mettre le devis dans l'espace du client supprime cette incertitude et retire à l'imprimeur un motif récurrent d'appel — « peux-tu me renvoyer le devis ? ». C'est aussi le socle d'un parcours autonome : sans le"},{"id":"E10.10b-2","title":"E10.10b-2 — Décision du client (accepter/refuser un devis)","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.10b-1"],"decisions":[],"sourcePath":"project/backlog/stories/E10.10b-2.md","summary":"Tant que la réponse du client arrive par courriel, l'imprimeur travaille sur une promesse : un « ok pour moi » dans un fil de discussion n'est ni daté de façon fiable, ni rattaché à une version précise de l'offre, ni opposable. Porter la décision dans l'outil donne trois choses d'un coup : l'acceptation déclenche la suite de la chaîne sans ressaisie, le refu"},{"id":"E10.10b-3","title":"E10.10b-3 — Notification (relais outbox + courriel client sur quote.sent)","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.10b-1","E10.10b-2"],"decisions":[],"sourcePath":"project/backlog/stories/E10.10b-3.md","summary":"Un devis déposé dans un espace que personne ne vient consulter est un devis perdu. Sans avertissement, l'imprimeur reste obligé d'écrire lui-même « je t'ai mis le devis en ligne », ce qui annule le bénéfice du portail. Le courriel est donc la pièce qui rend la lecture (E10.10b-1) et la décision (E10.10b-2) effectivement utilisables. Sa valeur tient à sa fiab"},{"id":"E10.10b-4a","title":"E10.10b-4a — Import et stockage du gabarit PDF par tenant","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E10.10b-4a.md","summary":"Un devis est un document commercial : il porte le logo, la typographie, les mentions légales et la mise en page de l'imprimeur. Un PDF générique sorti de l'outil n'est pas utilisable tel quel — l'imprimeur le refait à la main, ce qui annule le bénéfice d'automatiser l'envoi. Laisser chaque espace apporter son propre fond résout le problème sans que Magrit ai"},{"id":"E10.10b-4b","title":"E10.10b-4b — Éditeur visuel de correspondance coordonnées","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.10b-4a"],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/E10.10b-4b.md","summary":"Sans cet écran, placer une adresse ou un total sur un gabarit se négocie par échange de coordonnées entre l'imprimeur et un développeur : chaque ajustement de trois millimètres coûte un aller-retour. L'éditeur visuel transfère ce réglage à celui qui connaît sa maquette. Il transforme un paramétrage sur mesure, facturé au temps passé, en un geste d'autoconfig"},{"id":"E10.10b-4c","title":"E10.10b-4c — Moteur de génération du document et branchement sur l'envoi","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.10b-4b","E10.10b-3"],"decisions":[],"sourcePath":"project/backlog/stories/E10.10b-4c.md","summary":"Les deux étapes précédentes n'ont de valeur que par celle-ci : un gabarit importé et des champs placés ne servent à rien tant que personne ne reçoit le document. Cette story ferme la chaîne — l'imprimeur importe son fond, place ses données une fois, et chaque devis part ensuite à sa marque sans aucune manipulation. Le gain est double : le document commercial"},{"id":"E10.11","title":"E10.11 — Séparation des droits Admin et Commercial sur la tarification","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-PRICING","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.3"],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/E10.11.md","summary":"La politique de prix est la décision économique la plus structurante d'un imprimeur : elle fixe ce que l'entreprise accepte de perdre et ce qu'elle exige de gagner. La confier à tout membre de l'espace revient à laisser chacun redéfinir la marge de l'entreprise. À l'inverse, verrouiller le commercial au point qu'il ne puisse plus ajuster un prix en rende"},{"id":"E10.12","title":"E10.12 — Bouton Valider : transformation d'un devis en commande côté back-office Magrit","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-ORDERS","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.3","E10.9","E10.21"],"decisions":["PD-2026-10-05-COMMANDES-UNIQUE"],"sourcePath":"project/backlog/stories/E10.12.md","summary":"La validation d'un devis est l'instant où un échange commercial devient un engagement. Tant qu'elle se fait par une liste déroulante au milieu d'une grille, elle se déclenche par erreur, et une commande créée par mégarde coûte un appel client, parfois une production lancée pour rien. Un bouton distinct rend l'acte visible et intentionnel. Le second effet com"},{"id":"E10.13","title":"E10.13 — Étapes de production configurables et ordonnançables","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.12"],"decisions":[],"sourcePath":"project/backlog/stories/E10.13.md","summary":"Aucun atelier ne travaille comme le voisin : l'un a un poste façonnage, l'autre sous-traite l'expédition, un troisième n'a pas de PAO. Un jeu d'étapes figé dans le code oblige chaque imprimeur à traduire mentalement ses propres postes en libellés étrangers — et le suivi devient faux, parce que personne ne tient à jour un état qui ne décrit pas son travail. R"},{"id":"E10.14","title":"E10.14 — Modale unifiée de changement de statut et historique horodaté","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.0","E10.13"],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/E10.14.md","summary":"Changer un statut dans une grille dense, c'est se tromper de ligne. La séance du 28/08/2026 l'a dit sans détour : « le risque de connerie est trop gros ». Une erreur de statut n'est pas un désagrément d'interface — elle envoie une commande en production avant validation des fichiers, ou déclenche une notification client à contretemps. Sortir le geste de la g"},{"id":"E10.15","title":"E10.15 — Objet Notification multicanal : email et SMS, architecture extensible","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.0","E10.13","E10.14"],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/E10.15.md","summary":"Un imprimeur passe un temps considérable à dire à ses clients où en est leur travail — par téléphone, par courriel, de mémoire. Automatiser ces messages ne supprime pas seulement une corvée : cela supprime les appels entrants « où en est ma commande ? », qui sont le coût caché du suivi de production. Trois choix conditionnent la valeur. Le contenu doit être "},{"id":"E10.16","title":"E10.16 — Écran de détail d'une commande","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-ORDERS","specStatus":"draft","deliveryStatus":"verified","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.12","E10.14","E10.17","E10.21"],"decisions":["PD-2026-10-05-COMMANDES-UNIQUE"],"sourcePath":"project/backlog/stories/E10.16.md","summary":"L'écran de commande hérité a été qualifié de rustique en séance : il manque le détail, donc le gestionnaire ouvre un autre outil, rappelle un collègue, ou travaille de mémoire. Une fiche complète supprime ces détours. Elle porte aussi une garantie que l'interface est seule à rendre visible : aucun montant n'y est modifiable. Les prix ont été figés à la conve"},{"id":"E10.17","title":"E10.17 — Magasin de fichiers unifié par commande et par item (public / privé)","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.0","E10.12","E10.16"],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/E10.17.md","summary":"Les fichiers d'une commande arrivent de partout : le client envoie ses visuels, l'atelier produit un bon à tirer, un module tiers dépose un gabarit. Sans magasin unique, ils vivent dans des boîtes mail et des dossiers réseau, et la question « quel fichier correspond à quel produit » se règle au téléphone. Une commande à trois produits rend cette question per"},{"id":"E10.17a","title":"E10.17a — Base et API du dépôt de fichiers par commande","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.10b-4a","E10.16","E10.17"],"decisions":[],"sourcePath":"project/backlog/stories/E10.17a.md","summary":"Un magasin de fichiers se juge sur ce qu'il refuse, pas sur ce qu'il accepte. Livrer d'abord le socle sans écran permet d'éprouver les gardes — isolation entre espaces, impossibilité de rattacher un fichier à la ligne d'une autre commande, chemin de stockage imposé par le serveur — là où elles se vérifient par exécution et non par relecture d'interface. L'éc"},{"id":"E10.17b","title":"E10.17b — Panneau de dépôt et gestion des fichiers sur la fiche commande","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.16","E10.17","E10.17a"],"decisions":[],"sourcePath":"project/backlog/stories/E10.17b.md","summary":"Le socle livré en E10.17a ne sert à personne sans écran. Ce lot est ce qui transforme une interface technique en pratique d'atelier : les bons à tirer, justificatifs et visuels de référence cessent de circuler par courriel et se rangent là où on les cherche — sur la commande. La valeur tient à des détails qui décident de l'adoption : un refus annoncé avant l"},{"id":"E10.18","title":"E10.18 — Export XLSX et CSV des commandes pour la comptabilité","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-EXPORTS","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.0","E10.12","E10.16"],"decisions":["PD-2026-10-01-B3","PD-2026-10-05-COMMANDES-UNIQUE"],"sourcePath":"project/backlog/stories/E10.18.md","summary":"Les services comptables sont fermés aux connexions directes : ils travaillent sur des fichiers. Un export n'est donc pas un pis-aller, c'est l'interface réelle entre l'atelier et la comptabilité, et il doit être traité comme un livrable de première classe. Tout le bénéfice tient à une condition : que le fichier supprime la ressaisie. Un montant exporté en te"},{"id":"E10.19","title":"E10.19 — Génération du PDF Bon de commande","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-ORDERS","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.0","E10.12","E10.16"],"decisions":[],"sourcePath":"project/backlog/stories/E10.19.md","summary":"« Il faut pouvoir générer un PDF bon de commande sur la commande quoi qu'il arrive, ils vont le demander direct. » La demande est immédiate et universelle : un client veut une trace écrite de ce qu'il a commandé, à son nom, aux montants convenus. Sans elle, l'atelier bricole un document à la main, ce qui coûte du temps et introduit des écarts avec le système"},{"id":"E10.2","title":"E10.2 — Tags libres colorés sur les projets, recherche et filtrage","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-PROJECTS","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.1"],"decisions":["PD-2026-10-01-B1"],"sourcePath":"project/backlog/stories/E10.2.md","summary":"Un commercial qui gère cinquante affaires ne les range pas selon le plan de classement de quelqu'un d'autre. Une arborescence de dossiers oblige à choisir une seule dimension — le client, la campagne, l'année — et se périme dès qu'on en veut une deuxième. Des tags libres, créés à la volée, laissent chacun construire son propre repérage sans demander la permi"},{"id":"E10.20","title":"E10.20 — Lien public de dépôt de fichiers et validation explicite par le client","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.0","E10.17","E10.17a"],"decisions":[],"sourcePath":"project/backlog/stories/E10.20.md","summary":"La transmission des fichiers est le point où une commande s'enlise. Le client n'a pas de compte, son agence PAO encore moins, et tout finit par circuler en pièces jointes que l'atelier rapatrie à la main. Un lien unique, transmissible à un tiers, supprime ce goulet. Deux corrections de la séance du 01/09/2026 portent l'essentiel de la valeur. Un seul lien pa"},{"id":"E10.21","title":"E10.21 — Interface PricingEngine : contrat stable et implémentation provisoire mono-prix","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-PRICING","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.0","E10.6","E10.7"],"decisions":["PD-2026-10-05-HOPESTUDIO"],"sourcePath":"project/backlog/stories/E10.21.md","summary":"Au WM du 01/09/2026, la décomposition réelle du prix — impression, façonnage, conditionnement, livraison, avec un taux de marge par poste — a été gelée : Xavier Péchoultres veut d'abord trancher côté Clariprint la façon dont le prix remonte, la livraison étant le cas le plus délicat puisqu'elle supporte une marge nulle ou très faible calculée ailleurs. « Ce "},{"id":"E10.3","title":"E10.3 — Création d'un devis depuis un projet avec sélection multi-produits","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-QUOTES","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.1","E10.4"],"decisions":[],"sourcePath":"project/backlog/stories/E10.3.md","summary":"Entre « j'ai chiffré trois produits » et « j'envoie une offre au client », il ne doit rien y avoir à retaper. Chaque ressaisie est une occasion de se tromper de quantité, de format ou de prix, et une erreur de devis se paie en marge ou en crédibilité. Le passage du projet au devis est donc le moment où la valeur du chiffrage se matérialise : il doit être un "},{"id":"E10.4","title":"E10.4 — Entité Client (personne morale ou physique) et interlocuteurs","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-CUSTOMERS","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E6.1"],"decisions":[],"sourcePath":"project/backlog/stories/E10.4.md","summary":"C'est la lacune structurante relevée en séance : aujourd'hui le client n'existe pas, une adresse email en tient lieu. Un imprimeur qui travaille pour un groupe a dix interlocuteurs che"},{"id":"E10.5","title":"E10.5 — Dissociation des comptes utilisateurs Magrit et des comptes clients boutique","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-CUSTOMERS","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.4"],"decisions":[],"sourcePath":"project/backlog/stories/E10.5.md","summary":"Confondre un utilisateur et un client est la faute qui coûte le plus cher : le client final qui accède au back-office voit les coûts de production, les marges, les règles tarifaires négociées avec ses concurrents, et les affaires des autres clients de l'imprimeur. Ce n'est pas une gêne d'interface, c'est une fuite commerciale irréparable. Xavier Péchoultres "},{"id":"E10.6","title":"E10.6 — Référentiel des règles de prix : marge publique standard et règles ciblées","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-PRICING","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.4"],"decisions":["PD-2026-10-05-HOPESTUDIO"],"sourcePath":"project/backlog/stories/E10.6.md","summary":"Le prix qui remonte de Clariprint est un coût de production, pas un prix de vente. Tout ce qui sépare le coût du prix facturé — la marge, l'accord négocié avec un gros client, l'opération promotionnelle sur une gamme — est la politique commerciale de l'imprimeur, et elle lui appartient. Tant qu'elle vit dans la tête des commerciaux, elle n'est ni pilotable n"},{"id":"E10.7","title":"E10.7 — Règles de prix concurrentes : arbitrage par la règle la plus récente","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-PRICING","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.0","E10.6"],"decisions":[],"sourcePath":"project/backlog/stories/E10.7.md","summary":"Une marge générale court sur l'année. En juin, l'administrateur décide d'une opération sur septembre. Trois façons de faire : découper la règle annuelle en morceaux, ajouter un niveau de priorité à gérer à la main, ou simplement dire que la dernière règle posée gagne. Les deux premières ont été essayées et écartées — Xavier Péchoultres, retour d'expérience C"},{"id":"E10.8","title":"E10.8 — [GELÉE — spécification seulement] Moteur de calcul : coût de production vers prix public et prix client","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-PRICING","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.3","E10.6"],"decisions":[],"sourcePath":"project/backlog/stories/E10.8.md","summary":"Le prix qui remonte de Clariprint n'a pas toujours le même sens : ce peut être un prix de vente saisi par un imprimeur, ou un coût de production pur. Vendre sur un prix dont on ignore la nature, c'est vendre à l'aveugle — soit on empile une marge sur une marge et on devient trop cher, soit on vend à perte. La pratique retenue est d'utiliser le coût de produc"},{"id":"E10.9","title":"E10.9 — Remises granulaires par ligne de devis et traçabilité d'audit","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E10.21","E10.11"],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/E10.9.md","summary":"Un devis d'imprimeur ne se négocie pas en bloc : on serre sur l'impression pour tenir un prix, on garde la marge sur la structure ou le façonnage. Sans granularité par ligne, le commercial applique une remise globale qui rabote indistinctement tous les postes, y compris ceux où il n'y avait rien à donner. La contrepartie est la traçabilité : dès lors que cha"},{"id":"E2.1","title":"E2.1 — Mode extrapolation ouverte (Freemium+)","type":"story","epic":"EPIC-E2","feature":"FEAT-E2-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E2.4"],"decisions":[],"sourcePath":"project/backlog/stories/E2.1.md","summary":"L'acheteur qui commande de l'imprimé ne parle pas le vocabulaire de l'atelier : il sait qu'il ouvre un magasin, pas qu'il lui faut du 135 g couché mat. Un formulaire à champs obligatoires le bloque et il abandonne, ou il appelle le deviseur, qui refait le travail à la main. En acceptant une phrase floue et en la transformant en propositions chiffrées, Magrit"},{"id":"E2.2","title":"E2.2 — Mode interprétation stricte (Pro+)","type":"story","epic":"EPIC-E2","feature":"FEAT-E2-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"in-progress","lifecycleStatus":null,"owner":"unassigned","dependencies":["E2.3"],"decisions":[],"sourcePath":"project/backlog/stories/E2.2.md","summary":"Un deviseur ou un acheteur aguerri qui dicte « 5 000 plaquettes A4 quadri recto verso sur 135 g couché mat plié en deux » a déjà fait le travail de spécification. Si l'IA ajoute des variantes, arrondit des quantités ou « améliore » le papier, elle lui fait perdre du temps et détruit la confiance : il repasse au tableur. Le mode strict garantit la fidélité à "},{"id":"E2.3","title":"E2.3 — Questions de clarification dialoguée","type":"story","epic":"EPIC-E2","feature":"FEAT-E2-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E2.3.md","summary":"Une demande incomplète produit soit une proposition fausse, soit une série d'allers-retours où l'utilisateur reformule sa phrase en espérant mieux tomber. Dans les deux cas l'imprimeur perd un devis ou du temps de deviseur. Poser la bonne question, dans le bon ordre, transforme une demande floue en demande chiffrable en quelques échanges — et met en avant ce"},{"id":"E2.4","title":"E2.4 — Limite à 25 paramètres par prompt","type":"story","epic":"EPIC-E2","feature":"FEAT-E2-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"in-progress","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E2.4.md","summary":"Plus le contexte envoyé au modèle est long, plus celui-ci invente : il confond deux produits évoqués à dix messages d'intervalle, ou ressort une quantité périmée. Pour un imprimeur, une hallucination n'est pas un désagrément, c'est un devis faux envoyé à un client. Borner le contexte protège la fiabilité du chiffrage et, accessoirement, plafonne la facture d"},{"id":"E2.fix-TF55","title":"E2.fix-TF55 — ShopLayout applique data-theme=\"dark\" par défaut","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E_ROOT.fix-PublicShop-hooks"],"decisions":[],"sourcePath":"project/backlog/stories/E2.fix-TF55.md","summary":"Le mode sombre n'est pas une préférence d'affichage ici : c'est le rendu sur lequel la boutique a été dessinée et validée. Quand il ne s'applique pas, la boutique s'ouvre dans un thème qui n'a jamais été relu — contrastes non vérifiés, couleurs de marque posées sur un fond qui n'était pas prévu pour elles. Ce que cela coûtait : une boutique montrée à un clie"},{"id":"E3.1","title":"E3.1 — Affichage progressif descriptif + prix","type":"story","epic":"EPIC-E3","feature":"FEAT-E3-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"in-progress","lifecycleStatus":null,"owner":"unassigned","dependencies":["E3.2"],"decisions":[],"sourcePath":"project/backlog/stories/E3.1.md","summary":"Un chiffrage print n'est pas instantané : le modèle rédige, puis le fournisseur calcule, et l'addition des deux se compte en di"},{"id":"E3.2","title":"E3.2 — Infrastructure WebSocket","type":"story","epic":"EPIC-E3","feature":"FEAT-E3-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"in-progress","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E3.2.md","summary":"Toutes les promesses d'attente supportable de l'epic E3 reposent sur un même préalable : pouvoir envoyer une réponse en plusieurs fois. Sans ce canal, chaque story d'affichage progressif retombe sur une requête unique dont la durée est celle du maillon le plus lent, et le produit ne peut ni afficher partiellement, ni tenir une promesse de délai, ni mesurer c"},{"id":"E3.3","title":"E3.3 — Bouton rafraîchissement prix","type":"story","epic":"EPIC-E3","feature":"FEAT-E3-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E3.3.md","summary":"Quand le descriptif est là et que le prix ne vient pas, l'utilisateur n'a aujourd'hui qu'un geste à sa disposition : recharger la page. Ce geste est le pire de tous — il perd la conversation, relance la rédaction du descriptif, et refait payer le travail du modèle pour un résultat déjà obtenu. Offrir une relance ciblée transforme une impasse en action : l'ut"},{"id":"E3.4","title":"E3.4 — UX simplifiée saisie données imprimeur","type":"story","epic":"EPIC-E3","feature":"FEAT-E3-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E3.4.md","summary":"Le paramétrage est la marche la plus haute du produit : tant qu'un imprimeur ne l'a pas franchie, il ne chiffre rien, ne reçoit rien, et ne voit aucune raison de payer. Un formulaire exhaustif présenté d'emblée est un refus déguisé — l'imprimeur repousse, puis abandonne. En rendant la saisie progressive, en montrant où l'on en est et en donnant une contrepar"},{"id":"E4.1","title":"E4.1 — Création et gestion de panier","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E4.1.md","summary":"Un acheteur d'imprimés commande rarement une seule chose : une ouverture de magasin, c'est des flyers, une affiche, un kakémono. Sans panier, chacun part en commande séparée — l'imprimeur reçoit trois commandes à regrouper à la main, et l'acheteur refait trois fois le même parcours. Le panier réduit le nombre de commandes à traiter côté atelier, augmente le "},{"id":"E4.2","title":"E4.2 — Validation d'une commande boutique par un utilisateur Pro (storefront)","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-05-COMMANDES-UNIQUE"],"sourcePath":"project/backlog/stories/E4.2.md","summary":"Tant que la commande se conclut hors de l'outil, l'imprimeur retrouve un panier abandonné, un courriel et un appel : il ressaisit, il interprète, il se trompe. Terminer le cycle dans la boutique donne à chaque commande un numéro, une date, un auteur et un montant que personne ne retape, et donne au client final un endroit où lire l'avancement sans téléphoner"},{"id":"E4.3","title":"E4.3 — Terminal de paiement Stripe","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E4.3.md","summary":"Une commande non encaissée reste une promesse : l'imprimeur produit avant d'être payé, relance, et porte le risque. Encaisser au moment de la commande supprime le délai entre l'engagement et le règlement, et fait disparaître le travail administratif qui va avec — facture à émettre à la main, rapprochement, relance. Pour une boutique ouverte à des clients que"},{"id":"E4.4","title":"E4.4 — Back-office imprimeur (validation commandes)","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-05-COMMANDES-UNIQUE","PD-2026-10-06-COMMANDES-STATUT-UNIQUE"],"sourcePath":"project/backlog/stories/E4.4.md","summary":"Une commande qui arrive de la boutique entre en production sans que personne l'ait regardée : c'est un risque de produire une commande douteuse, hors capacité, ou d'un client dont l'encours n'est pas sain. À l'inverse, demander une validation humaine sur chaque commande coûte plus cher que ce qu'elle rapporte sur les petits montants. Un écran de tri avec des"},{"id":"E4.4a","title":"Fiche de consultation et modification des commandes","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"approved","deliveryStatus":"verified","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-05-COMMANDES-UNIQUE","PD-2026-10-06-COMMANDES-STATUT-UNIQUE"],"sourcePath":"project/backlog/stories/E4.4a.md","summary":"En tant que gestionnaire de commandes, je veux ouvrir une commande pour consulter ses informations complètes et modifier les informations ou son état que mes droits et les règles métier autorisent, afin de traiter la commande sans me limiter aux colonnes de la liste."},{"id":"E4.4b","title":"Convergence technique du modèle Commande","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"approved","deliveryStatus":"verified","lifecycleStatus":null,"owner":"unassigned","dependencies":["E4.4a"],"decisions":["PD-2026-10-05-COMMANDES-UNIQUE","PD-2026-10-06-COMMANDES-STATUT-UNIQUE","ADR-2026-10-06-COMMANDES-LECTURE"],"sourcePath":"project/backlog/stories/E4.4b.md","summary":"En tant que gestionnaire, je veux que la liste, la fiche, les filtres, les exports et les actions travaillent sur le même référentiel de commandes, afin de disposer des mêmes capacités quelle que soit l'origine de la commande."},{"id":"E4.4c","title":"Pilotage des statuts depuis la liste commune","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"approved","deliveryStatus":"verified","lifecycleStatus":null,"owner":"unassigned","dependencies":["E4.4a","E4.4b"],"decisions":["PD-2026-10-05-COMMANDES-UNIQUE","PD-2026-10-06-COMMANDES-STATUT-UNIQUE"],"sourcePath":"project/backlog/stories/E4.4c.md","summary":"En tant que gestionnaire de commandes, je veux consulter et modifier le statut d'une commande, ou appliquer la même étape à plusieurs commandes, depuis la liste commune, afin de piloter la production sans changer d'écran ni devoir comprendre deux workflows concurrents."},{"id":"E4.fix-TF54","title":"Fix TF-54 — PortalCart CartSummary expose badge global Prix marché","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B4"],"sourcePath":"project/backlog/stories/E4.fix-TF54.md","summary":"L'acheteur décide sur le total du panier, pas sur la carte produit qu'il a vue trois écrans plus tôt. Si le récapitulatif ne dit pas qu'un prix peut bouger, il commande en croyant le montant acquis — et découvre l'écart à la validation de l'imprimeur. Le coût, ce sont des commandes contestées et un appel par commande."},{"id":"E4.WM1","title":"Storefront — Magasin centralisé multi-clients","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E4.WM1.md","summary":"Ouvrir une boutique par client ne tient pas la charge : autant d'adresses à créer, à maintenir, à facturer. Une boutique unique où l'identifiant détermine ce que le client voit permet à l'imprimeur d'embarquer un nouveau client en quelques minutes, avec son catalogue et ses prix négociés, sans rien dupliquer. L'imprimeur garde une seule vitrine à tenir à jou"},{"id":"E4.WM2","title":"Storefront — URL dédiée par client","type":"story","epic":"EPIC-E4","feature":"FEAT-E4-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E4.WM1"],"decisions":[],"sourcePath":"project/backlog/stories/E4.WM2.md","summary":"Un client un peu important ne veut pas d'une boutique partagée : il veut une adresse qui lui ressemble, qu'il diffuse à ses équipes comme un outil interne. Pour l'imprimeur, c'est un argument de fidélisation — une fois l'adresse en place dans les habitudes du client, elle ne se déplace plus. Encore faut-il que l'ouvrir coûte une minute et non une journée de "},{"id":"E5.1","title":"E5.1 — API publication CMS (Pro+)","type":"story","epic":"EPIC-E5","feature":"FEAT-E5-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B1"],"sourcePath":"project/backlog/stories/E5.1.md","summary":"Un web-to-printer qui tourne a déjà investi dans son storefront, son référencement et ses habitudes d'exploitation. Lui demander de changer de vitrine pour gagner un moteur de devis, c'est lui demander d'arrêter de vendre pendant la migration : il refusera. La promesse commerciale de l'offre Pro est exactement l'inverse — « nous ne remplaçons pas votre ERP n"},{"id":"E5.2","title":"E5.2 — Connecteurs ERP/MIS (Tharstern, EFI Pace, Cegid, Sage)","type":"story","epic":"EPIC-E5","feature":"FEAT-E5-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E5.2.md","summary":"Un imprimeur industriel n'a pas un outil de gestion, il a son outil de gestion : ses nomenclatures, ses références, ses habitudes de saisie, et souvent dix ans de données dedans. Lui demander de doubler sa saisie, c'est lui garantir qu'au bout de trois semaines plus personne ne saisira dans Magrit. Le connecteur n'est donc pas un confort d'intégration : c'es"},{"id":"E5.3","title":"E5.3 — Connecteurs Enterprise (SAP, Oracle, Salesforce, BPMN)","type":"story","epic":"EPIC-E5","feature":"FEAT-E5-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.7"],"decisions":[],"sourcePath":"project/backlog/stories/E5.3.md","summary":"Che"},{"id":"E6.1","title":"E6.1 — Validation SIREN + email professionnel","type":"story","epic":"EPIC-E6","feature":"FEAT-E6-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"verified","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E6.1.md","summary":"Magrit est B2B exclusif, et ce n'est pas une posture : un espace donne accès à des tarifs d'atelier, à des prix négociés et à la description d'un parc machines. Rien de tout cela ne doit s'ouvrir sur une adresse jetable. Le contrôle à la création est la seule barrière posée avant que ce contenu ne devienne accessible. Le même geste sert la qualité de la base"},{"id":"E6.2","title":"E6.2 — Saisie simplifiée données imprimeur (Freemium)","type":"story","epic":"EPIC-E6","feature":"FEAT-E6-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E6.2.md","summary":"Un imprimeur ne remplit un paramétrage exhaustif que s'il est déjà convaincu. L'offre Freemium doit renverser l'ordre : d'abord une saisie courte, ensuite une contrepartie immédiate — apparaître dans les résultats. Sans cette marche basse, le côté offre du marché reste vide, et un moteur qui n'a personne à proposer ne sert à rien, quelle que soit la qualité "},{"id":"E6.3","title":"E6.3 — Outil AO gratuit (Freemium acquisition annonceurs)","type":"story","epic":"EPIC-E6","feature":"FEAT-E6-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E6.3.md","summary":"La valeur visée est d'abord une valeur d'acquisition, et la source l'assume : l'outil est décrit comme le « cheval de Troie vers les annonceurs ». Un acheteur qui rédige ses consultations dans Magrit y prend ses habitudes, y laisse ses fournisseurs et son historique ; le passage à l'offre Enterprise devient la suite naturelle plutôt qu'une décision d'achat à"},{"id":"E7.1","title":"E7.1 — Suivi consommation tokens par utilisateur","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"in-progress","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E7.1.md","summary":"Le coût du modèle est proportionnel aux jetons consommés, et il est engagé avant qu'on sache s'il produira un devis ou rien du tout. Sans comptage par utilisateur, un compte Freemium intensif peut coûter davantage qu'un abonné payant, et personne ne s'en aperçoit avant la facture. Le comptage est le préalable de tout le reste de l'epic : sans lui, pas de pla"},{"id":"E7.2","title":"E7.2 — Scalabilité serverless AO Enterprise","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E7.2.md","summary":"Un appel d'offres Enterprise n'est pas un gros devis : c'est un autre régime. 40 000 à 100 000 calculs de prix tombent d'un coup, une fois par mois ou une fois par trimestre. Dimensionner la plateforme en permanence pour ce pic, c'est payer toute l'année une capacité utilisée quelques heures ; ne pas la dimensionner, c'est perdre le segment qui paie le mieux"},{"id":"E7.3","title":"E7.3 — Monitoring usage, quotas, coûts","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E7.3.md","summary":"Deux risques distincts, qu'une même surveillance couvre. Le premier est financier : le coût du modèle est engagé par les utilisateurs, pas par l'exploitation, et une poussée d'usage sur l'offre gratuite se traduit en facture avant de se traduire en revenu. Le second est contractuel : une dégradation de latence sur le chiffrage se voit che"},{"id":"E7.4","title":"E7.4 — Bootstrap Beta 4 isolée + correctifs hérités Beta 3","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"contradictory","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E2.1","E2.2","E2.4","E7.1"],"decisions":[],"sourcePath":"project/backlog/stories/E7.4.md","summary":"Historique. La valeur recherchée — ne plus hériter des défauts d'une bêta à l'autre — est aujourd'hui portée par le socle de migrations versionnées et par ADR-2026-10-01-C5, qui assume le regroupement du schéma et la non-reprise des données historiques."},{"id":"E7.5","title":"E7.5 — Blocage Freemium au dépassement de quota","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E7.1","E9.8"],"decisions":[],"sourcePath":"project/backlog/stories/E7.5.md","summary":"Une offre gratuite sans plafond opposable n'est pas une offre, c'est une fuite. Le coût d'un devis est engagé à chaque demande, qu'elle convertisse ou non, et il est engagé par celui qui ne paie pas. Le plafond fait deux choses à la fois : il borne la perte, et il transforme le moment où l'utilisateur bute en moment commercial — à condition que ce moment soi"},{"id":"E7.6","title":"E7.6 — Dashboard ops consommation LLM + API publique usage","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E7.1","E7.5"],"decisions":[],"sourcePath":"project/backlog/stories/E7.6.md","summary":"Le coût du modèle est la seule charge de la plateforme qui croît avec l'usage sans croître avec le revenu. Tant qu'il n'est pas regardé, l'offre gratuite est un pari : on saura si elle tient quand on recevra la facture. Un tableau de bord change la nature de la décision — il permet de régler les plafonds sur des faits, de repérer l'espace qui consomme vingt "},{"id":"E7.7","title":"E7.7 — Instrumentation data-testid pour automatisation de tests","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.5","E3.1","E3.2","E7.5","E7.6"],"decisions":[],"sourcePath":"project/backlog/stories/E7.7.md","summary":"Un cahier de tests qui casse à chaque retouche de style coûte deux fois : une fois pour le réparer, une fois en confiance perdue, parce qu'une alerte rouge qui vient du style finit par ne plus être lue. Ancrer les tests sur des identifiants stables plutôt que sur des classes ou des libellés visibles rend la campagne de recette rejouable, par un humain comme "},{"id":"E7.8","title":"E7.8 — Seed SQL pour les cahiers de tests fonctionnels","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E7.4","E9.1","E9.4"],"decisions":[],"sourcePath":"project/backlog/stories/E7.8.md","summary":"Une recette qui commence par trente minutes de préparation manuelle n'est pas jouée aussi souvent qu'elle devrait l'être, et deux testeurs qui préparent leur environnement chacun de leur côté ne testent pas la même chose. Les écarts qui en découlent coûtent plus cher que le défaut cherché : on passe le temps à départager l'anomalie du mauvais état initial. U"},{"id":"E7.WM1","title":"Quotas journaliers par tier — Freemium et Découverte","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E7.WM2"],"decisions":[],"sourcePath":"project/backlog/stories/E7.WM1.md","summary":"Un plafond mensuel laisse passer la pointe : un utilisateur peut consommer son allocation entière en une journée, et c'est précisément ce que fait celui qui cherche à éprouver le service gratuitement. Le plafond journalier lisse la dépense, rend le coût prévisible au jour le jour, et transforme l'offre d'entrée de gamme en essai plutôt qu'en service gratuit."},{"id":"E7.WM2","title":"Dashboard monitoring coûts LLM par devis","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E7.WM1"],"decisions":[],"sourcePath":"project/backlog/stories/E7.WM2.md","summary":"Toute la tarification repose aujourd'hui sur un chiffre jamais vérifié : « environ 0,50 € par devis », noté en atelier le 12 mai 2026. Ce chiffre sert à fixer les plafonds, à calibrer les offres, à juger si l'offre gratuite est tenable. S'il est faux d'un facteur deux dans un sens, on brade ; dans l'autre, on se prive de clients pour rien. Mesurer le coût ré"},{"id":"E8.1","title":"E8.1 — Catalogue standard 38 produits print","type":"story","epic":"EPIC-E8","feature":"FEAT-E8-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E8.1.md","summary":"Rien ne tient sans ce socle. L'assistant ne peut proposer que ce qui existe au catalogue, le moteur de prix ne peut chiffrer qu'une configuration définie, et une boutique ne peut vendre qu'un produit décrit. Le catalogue standard n'est pas une fonctionnalité parmi d'autres : c'est la matière sur laquelle toutes les autres s'appliquent. Le nombre de 38 est un"},{"id":"E8.2","title":"E8.2 — Catalogue enrichi (Pro+) : papiers rares, finitions spéciales","type":"story","epic":"EPIC-E8","feature":"FEAT-E8-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E8.2.md","summary":"Le catalogue standard couvre ce que tout le monde vend. Or un imprimeur ne se différencie pas sur le flyer A5 : il se différencie sur la dorure à chaud, le papier texturé et la découpe à la forme. Un outil qui ignore cette partie du métier reste un outil pour les commandes banales, et l'imprimeur continue de chiffrer à la main ce sur quoi il gagne le plus. L"},{"id":"E8.3","title":"E8.3 — Gabarits 2D automatisés (Pro+)","type":"story","epic":"EPIC-E8","feature":"FEAT-E8-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"in-progress","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E8.3.md","summary":"Le fichier mal préparé est le premier motif de retour en prépresse : fond perdu absent, texte trop près de la coupe, format qui ne correspond pas à la commande. Chaque retour coûte un aller-retour avec le client, retarde la production et use la relation. Fournir le gabarit au moment même de la configuration déplace ce contrôle en amont, là où il ne coûte rie"},{"id":"E8.4","title":"E8.4 — Visualisation 3D packaging (Enterprise)","type":"story","epic":"EPIC-E8","feature":"FEAT-E8-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E8.4.md","summary":"Un packaging ne se juge pas à plat. Une boîte pliante se valide sur son volume, la place de la fenêtre, la lisibilité du logo sur la face vue en rayon. Aujourd'hui cette validation passe par un prototype physique : coûteux, lent, et refait à chaque itération. La valeur visée est donc un raccourcissement du cycle de décision che"},{"id":"E9.1","title":"E9.1 — Renommer onglet « Clients » → « Utilisateurs » dans le dashboard d'espace","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.2","E9.3"],"decisions":["PD-2026-10-05-UM"],"sourcePath":"project/backlog/stories/E9.1.md","summary":"Che"},{"id":"E9.10","title":"E9.10 — Tests RLS d'étanchéité multi-tenant automatisés","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.3"],"decisions":["PD-2026-10-05-UM"],"sourcePath":"project/backlog/stories/E9.10.md","summary":"L'étanchéité entre espaces est la promesse que Magrit ne peut pas se permettre de rompre une seule fois : un imprimeur qui verrait les prix d'un confrère, ou un acheteur qui verrait les commandes d'un autre client, met fin à la relation commerciale et expose l'éditeur. Or cette garantie se dégrade silencieusement — une table ajoutée sans protection, une règl"},{"id":"E9.11","title":"E9.11 — Réintégrer un produit exclu de boutique (one-way → two-way)","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"verified","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E9.11.md","summary":"Retirer un produit d'une boutique est un geste courant et rapide ; sans bouton inverse, la moindre erreur de clic devient une demande d'assistance. L'admin perd confiance dans un geste qu'il n'ose plus faire, ou pire, il catalogue Magrit comme un outil où « on ne peut pas revenir en arrière ». Rendre l'opération symétrique ne coûte presque rien et supprime à"},{"id":"E9.12","title":"E9.12 — Migrer claude-3-haiku → claude-haiku-4-5 sur B1/B2 claude-proxy","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"in-progress","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E9.12.md","summary":"Un modèle de langage déprécié finit par être retiré par son fournisseur, sans égard pour qui l'utilise encore. Le jour où cela arrive, les environnements concernés cessent de répondre. Harmoniser les modèles avant cette date évite une coupure subie, et supprime une différence de comportement entre environnements qui rend tout diagnostic confus. La valeur est"},{"id":"E9.13","title":"E9.13 — Refonte PortalShop /shop/:slug en portail B2B premium","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.3"],"decisions":["PD-2026-10-05-UM"],"sourcePath":"project/backlog/stories/E9.13.md","summary":"La boutique est ce que l'imprimeur montre à ses propres clients : c'est son image qui est en jeu, pas celle de Magrit. Un acheteur professionnel qui recommande les mêmes références chaque mois n'a pas besoin d'une vitrine, il a besoin de trouver, configurer et commander sans friction. Une boutique en retard d'une génération sur le reste du produit coûte deux"},{"id":"E9.2","title":"E9.2 — CRUD utilisateurs par admin d'espace","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.3","E9.5"],"decisions":["PD-2026-10-05-UM"],"sourcePath":"project/backlog/stories/E9.2.md","summary":"Tant qu'un seul compte de plateforme peut ajouter quelqu'un dans un espace, chaque arrivée, chaque départ et chaque changement de poste che"},{"id":"E9.3","title":"E9.3 — Droits granulaires : accès Magrit complet vs boutique uniquement","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"contradictory","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.2"],"decisions":["PD-2026-10-05-UM"],"sourcePath":"project/backlog/stories/E9.3.md","summary":"Un espace Magrit mélange deux populations qui n'ont rien à voir : l'atelier, qui chiffre, produit et administre, et l'acheteur che"},{"id":"E9.4","title":"E9.4 — Renommer un espace actif (admin + superadmin)","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E9.4.md","summary":"Un espace est nommé au moment de sa création, souvent dans l'urgence d'une démonstration ou d'un démarrage, parfois avec une faute. Six mois plus tard l'enseigne a changé, ou le groupe a réorganisé ses filiales. Sans renommage, le client vit avec un nom faux affiché à ses propres acheteurs, ou il faut recréer l'espace — ce qui veut dire tout reprendre. Sépar"},{"id":"E9.5","title":"E9.5 — Email invitations (Resend/SendGrid) avec lien d'activation","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.2"],"decisions":[],"sourcePath":"project/backlog/stories/E9.5.md","summary":"Tant que le lien d'activation se copie-colle à la main, chaque nouvel utilisateur consomme l'attention de quelqu'un et dépend de sa disponibilité. C'est aussi le premier contact d'un collaborateur avec Magrit : recevoir un lien brut dans une conversation privée n'inspire pas confiance, et rend l'outil impossible à vendre à un service informatique. L'envoi au"},{"id":"E9.6","title":"E9.6 — Wizard souscription gammes à la création tenant","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E9.6.md","summary":"Un espace créé sans gamme s'ouvre sur rien : pas de produit à configurer, pas de devis à faire, rien à montrer. C'est le pire moment possible pour un écran vide — celui où le client découvre l'outil. Poser la question au moment de la création coûte une étape et supprime un détour par un écran d'administration que personne ne trouve seul. C'est aussi la premi"},{"id":"E9.7","title":"E9.7 — Custom domain par tenant (table tenant_domains)","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.4"],"decisions":[],"sourcePath":"project/backlog/stories/E9.7.md","summary":"Un groupe qui ouvre Magrit à ses acheteurs et à ses clients ne veut pas les envoyer sur une adresse portant le nom d'un fournisseur : c'est une question de confiance autant que d'image. Dans une direction informatique, une adresse tierce déclenche en plus des questions de sécurité qui retardent le déploiement. Servir le service sur le domaine du client suppr"},{"id":"E9.8","title":"E9.8 — Billing Stripe par tenant (abonnements Magrit)","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/E9.8.md","summary":"Aujourd'hui, changer le plan d'un espace est un geste manuel en base. Cela veut dire qu'aucun client ne peut souscrire hors des heures ouvrées, qu'un impayé ne produit aucun effet tant que personne ne le remarque, et que le revenu récurrent n'est mesurable qu'à la main. Chaque nouvel espace ajoute de la charge au lieu d'en ajouter à la marge. Automatiser la "},{"id":"E9.9","title":"E9.9 — SSO SAML 2.0 / OIDC (Enterprise + Business+)","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.2","E9.3"],"decisions":["PD-2026-10-05-UM"],"sourcePath":"project/backlog/stories/E9.9.md","summary":"Dans une entreprise d'une certaine taille, un outil qui gère ses propres mots de passe est un outil qu'on n'achète pas : il échappe à la politique de sécurité, il survit au départ d'un salarié, et il ajoute un identifiant à retenir. Brancher Magrit sur l'annuaire du client supprime trois objections d'un coup — révocation immédiate, politique d'authentificati"},{"id":"FIX-GARDE","title":"Correctif — La règle du panier d'Arnaud était neutralisable par un commentaire","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"verified","lifecycleStatus":null,"owner":"unassigned","dependencies":["Q14-a"],"decisions":[],"sourcePath":"project/backlog/stories/FIX-GARDE.md","summary":"La règle d'Arnaud du 16/09 — un produit non chiffré ne s'ajoute pas tel quel au panier — n'est tenue, côté interface, que par une vérification qui relit le texte du code. Quand cette vérification se laisse tromper, la règle disparaît sans que rien ne s'allume : tests verts, compilateur silencieux, et tout produit redevient ajoutable au panier, chiffré ou non"},{"id":"Q14-a","title":"Q14-a — Bouton panier grisé quand le produit n'est pas chiffré","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStat
