us":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/Q14-a.md","summary":"Un acheteur qui met au panier un produit dont le prix n'est pas celui de l'imprimeur engage une transaction sur un chiffre que l'atelier n'a pas donné. Soit l'imprimeur honore un prix qu'il n'a pas fait, soit il revient sur une promesse affichée : dans les deux cas il perd. Conditionner l'ajout direct ferme ce risque à la source, et le faire en grisant plutô"},{"id":"Q17-a","title":"Q17-a — Le prix d'une commande boutique est recalculé côté serveur","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/Q17-a.md","summary":"Tant que le prix d'une commande est celui que le navigateur envoie, l'imprimeur vend au prix que l'acheteur choisit. Le risque reste théorique sur un pilote dont on connaît chaque acheteur ; il devient réel le jour où une boutique ouvre son inscription libre — n'importe qui ouvre un compte et commande à"},{"id":"Q17-c","title":"Q17-c — L'atelier voit l'écart de prix que Q17-a a rendu vrai","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["Q17-a"],"decisions":[],"sourcePath":"project/backlog/stories/Q17-c.md","summary":"Q17-a a rendu vrai côté serveur ce que l'atelier ne voyait pas. Le cadrage le formule ainsi : « le filet d'aujourd'hui est l'œil de la personne qui valide, et il est aveugle ». Livrer les refus sans rendre l'écart visible donne à l'atelier un refus que personne ne comprend — et laisse valider en aveugle les commandes qui passent. La valeur n'est pas dans la "},{"id":"Q18","title":"Q18 — Validité des devis à 30 jours par défaut, réglage dans le menu Devis","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/Q18.md","summary":"Un devis sans terme est une offre que l'imprimeur n'a jamais arrêtée : un client peut l'accepter six mois plus tard, au prix du papier d'avant. Poser 30 jours par défaut ferme ce risque pour tout espace nouvellement créé, sans que personne n'ait à y penser. Le déplacement du réglage, lui, règle un problème plus prosaïque : il vivait dans l'écran « Règles de "},{"id":"Q20","title":"Q20 — Un chiffrage ne survit plus à la configuration qui aurait dû le remplacer","type":"story","epic":"EPIC-E10","feature":"FEAT-E10-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":["Q14-a"],"decisions":[],"sourcePath":"project/backlog/stories/Q20.md","summary":"Un acheteur part d'une suggestion chiffrée, change la quantité et le papier, et le panier lui compte le prix d'avant — étiqueté comme un chiffrage de l'imprimeur, c'est-à-dire la source la plus forte de la hiérarchie de prix. Le parcours mentait sur le prix, et il mentait avec le label le plus crédible du système. Pour l'imprimeur, c'est une commande à honor"},{"id":"T01.1","title":"T01.1 — Onboarding d'un client corporate (espace brandé)","type":"story","epic":"EPIC-T01","feature":"FEAT-T01-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.4","E9.5","E9.7"],"decisions":["PD-2026-10-04-B3-FRANCHISE"],"sourcePath":"project/backlog/stories/T01.1.md","summary":"Un annonceur grand compte n'impose pas à ses cent collaborateurs un portail qui ne porte pas ses couleurs : sans espace à sa marque, l'adoption interne ne se fait pas et les commandes continuent de partir par courriel au deviseur. L'enjeu de cette story est double : rendre l'espace crédible aux yeux des utilisateurs du client, et rendre son ouverture asse"},{"id":"T01.2","title":"T01.2 — Rôles et permissions granulaires corporate","type":"story","epic":"EPIC-T01","feature":"FEAT-T01-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.2","E9.3"],"decisions":["PD-2026-10-04-B3-FRANCHISE"],"sourcePath":"project/backlog/stories/T01.2.md","summary":"Che"},{"id":"T01.3","title":"T01.3 — Budgets par département et engagement temps réel","type":"story","epic":"EPIC-T01","feature":"FEAT-T01-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-04-B3-FRANCHISE"],"sourcePath":"project/backlog/stories/T01.3.md","summary":"Un responsable de département découvre souvent son dépassement un mois après l'avoir commis, quand la facture arrive. Entre-temps il a validé des commandes qu'il n'aurait pas validées. Distinguer l'engagé du consommé est précisément ce qui manque : une commande en cours de validation n'est pas encore une dépense, mais elle n'est plus disponible. Rendre cette"},{"id":"T01.4","title":"T01.4 — Workflow de validation multi-niveaux","type":"story","epic":"EPIC-T01","feature":"FEAT-T01-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-04-B3-FRANCHISE"],"sourcePath":"project/backlog/stories/T01.4.md","summary":"Che"},{"id":"T01.5","title":"T01.5 — Bibliothèque de templates validés / brand consistency","type":"story","epic":"EPIC-T01","feature":"FEAT-T01-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E8.3"],"decisions":["PD-2026-10-04-B3-FRANCHISE"],"sourcePath":"project/backlog/stories/T01.5.md","summary":"Le gardien de la marque che"},{"id":"T01.6","title":"T01.6 — Reporting et audit trail corporate","type":"story","epic":"EPIC-T01","feature":"FEAT-T01-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-04-B3-FRANCHISE"],"sourcePath":"project/backlog/stories/T01.6.md","summary":"Un grand compte ne juge pas un fournisseur d'imprimé sur l'ergonomie de son portail, mais sur sa capacité à répondre à trois questions : qui a dépensé quoi, pourquoi, et peut-on le prouver. Sans rapports et sans trace, le responsable achats refait ses tableaux à la main et le directeur financier ne peut pas clore. Pire, en cas de contrôle, l'absence de piste"},{"id":"T02.1","title":"T02.1 — Master Owner Dashboard consolidé multi-sites","type":"story","epic":"EPIC-T02","feature":"FEAT-T02-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-04-B3-FRANCHISE"],"sourcePath":"project/backlog/stories/T02.1.md","summary":"Un responsable de réseau pilote aujourd'hui ses sites par appels et par tableurs envoyés en fin de mois : il apprend un décrochage quand il est installé depuis six semaines. Consolider l'activité en un écran change la nature du pilotage — on passe du constat à l'intervention. C'est aussi ce qui justifie l'abonnement du siège : chaque site paie pour son outil"},{"id":"T02.2","title":"T02.2 — Gestion centrale catalogue, templates, règles de prix (héritage master → site)","type":"story","epic":"EPIC-T02","feature":"FEAT-T02-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-04-B3-FRANCHISE"],"sourcePath":"project/backlog/stories/T02.2.md","summary":"Un réseau qui lance une offre doit aujourd'hui la redéployer site par site : au bout de cinquante sites, la cohérence est perdue et la mise à jour prend des semaines. L'inverse — tout verrouiller depuis le siège — se heurte au réel : un site n'a pas les mêmes coûts à Lille et à Nice, et un franchisé qui ne peut pas ajuster son prix finit par vendre hors de l"},{"id":"T02.3","title":"T02.3 — Onboarding d'un nouveau site par héritage de configuration","type":"story","epic":"EPIC-T02","feature":"FEAT-T02-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T02.2"],"decisions":["PD-2026-10-04-B3-FRANCHISE"],"sourcePath":"project/backlog/stories/T02.3.md","summary":"Ouvrir un site aujourd'hui, c'est refaire à la main tout ce qui existe déjà ailleurs : catalogue, gabarits, prix, circuits, connexions aux boutiques en ligne. Plusieurs semaines pendant lesquelles le site ne produit rien et le siège mobilise du monde. Faire hériter d'un coup l'ensemble de la configuration ramène cette durée à deux jours, et surtout garantit "},{"id":"T02.4","title":"T02.4 — Franchise Location Dashboard (isolation opérationnelle)","type":"story","epic":"EPIC-T02","feature":"FEAT-T02-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E9.10"],"decisions":["PD-2026-10-04-B3-FRANCHISE","PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/T02.4.md","summary":"Un franchisé est un entrepreneur indépendant : ses clients, ses marges et ses volumes ne regardent pas son voisin, et c'est souvent la condition qu'il pose avant d'accepter l'outil du réseau. L'isolation n'est donc pas un confort d'affichage, c'est un préalable commercial et, lorsque les sites sont des entités juridiques distinctes, une obligation. Le second"},{"id":"T02.5","title":"T02.5 — Gouvernance des commandes transversales (routage inter-sites)","type":"story","epic":"EPIC-T02","feature":"FEAT-T02-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-04-B3-FRANCHISE","PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/T02.5.md","summary":"Dans un réseau, un site refuse régulièrement une affaire qu'un autre site aurait pu produire : pas la bonne machine, pas la bonne spécialité, carnet plein. Chaque refus est du chiffre d'affaires qui sort du réseau. Faire circuler la commande transforme une perte en activité, à condition que l'argent suive : sans règle de partage, le site qui a trouvé le clie"},{"id":"T02.6","title":"T02.6 — Rapports consolidés avec drill-down (Network → Zone → Site → Équipe)","type":"story","epic":"EPIC-T02","feature":"FEAT-T02-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-04-B3-FRANCHISE"],"sourcePath":"project/backlog/stories/T02.6.md","summary":"Un chiffre consolidé qu'on ne peut pas ouvrir ne sert qu'à constater. Le responsable de réseau qui voit sa marge baisser de deux points a besoin de savoir en trois clics si c'est une"},{"id":"T03.1","title":"T03.1 — Connexion et authentification eCommerce (Shopify/Woo/Magento/BigC)","type":"story","epic":"EPIC-T03","feature":"FEAT-T03-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T03.1.md","summary":"Un imprimeur qui vend déjà sur Shopify ou WooCommerce ne changera pas de boutique pour adopter Magrit. Soit Magrit se branche sur ce qui tourne, soit la vente ne se fait pas. Le délai de mise en service est donc un argument commercial autant qu'une exigence technique : trois jours et un développeur, c'est un projet d'intégration ; trente minutes, c'est une f"},{"id":"T03.2","title":"T03.2 — Synchronisation initiale (import catalogue + historique)","type":"story","epic":"EPIC-T03","feature":"FEAT-T03-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T03.2.md","summary":"Un imprimeur qui branche Magrit sur une boutique en activité ne repart pas de"},{"id":"T03.3","title":"T03.3 — Synchronisation bidirectionnelle des statuts de commande","type":"story","epic":"EPIC-T03","feature":"FEAT-T03-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T03.3.md","summary":"Deux systèmes qui portent le même statut sans se parler, c'est une double saisie quotidienne et un client final qui voit « en préparation » alors que son colis est parti. Le gestionnaire de production finit par ne plus mettre à jour que le système qu'il regarde, et l'autre devient faux. Cette story supprime le travail en double et, surtout, supprime l'écart "},{"id":"T03.4","title":"T03.4 — Résilience et rattrapage après panne (Fetch Orders Utility)","type":"story","epic":"EPIC-T03","feature":"FEAT-T03-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T03.4.md","summary":"Les notifications entrantes se perdent : une API indisponible dix minutes, un réseau qui tombe, une plateforme qui n'a pas réémis. Sans outil de rattrapage, la seule option est de rejouer la synchronisation complète — coûteuse, longue, et risquée sur des données déjà en place. Un rattrapage ciblé transforme un incident d'exploitation d'une demi-journée en in"},{"id":"T03.5","title":"T03.5 — Mapping des variants (multi-color/size/option → config Clariprint)","type":"story","epic":"EPIC-T03","feature":"FEAT-T03-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E5.1"],"decisions":[],"sourcePath":"project/backlog/stories/T03.5.md","summary":"C'est le point où une intégration eCommerce se gagne ou se perd. Un acheteur choisit « A5, recto-verso, 250 g, pelliculage mat » sur la boutique ; si cette combinaison ne pointe pas vers la bonne configuration Clariprint, le prix affiché est faux. Trop bas, l'imprimeur produit à perte et ne s'en aperçoit qu'à la facture. Trop haut, la commande ne se fait pas"},{"id":"T03.6","title":"T03.6 — Observabilité et alerting connecteur eCommerce","type":"story","epic":"EPIC-T03","feature":"FEAT-T03-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T03.6.md","summary":"Une synchronisation qui s'arrête ne fait pas de bruit : il n'y a pas d'erreur à l'écran, simplement des commandes qui n'arrivent plus. Sans supervision, l'imprimeur le découvre trois jours plus tard, par un client qui s'étonne de n'avoir aucune nouvelle. À ce stade, le dégât n'est plus technique : c'est de la production non lancée, des délais manqués et un c"},{"id":"T03.WM1","title":"Synchronisation unidirectionnelle vers CMS — PrestaShop priorité","type":"story","epic":"EPIC-T03","feature":"FEAT-T03-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E4.WM1","E4.WM2","T03.WM2"],"decisions":[],"sourcePath":"project/backlog/stories/T03.WM1.md","summary":"Un imprimeur dont la boutique tourne sous PrestaShop ne la refera pas pour adopter Magrit. S'il doit ressaisir ses produits et ses prix dans deux systèmes, les deux divergent en quelques semaines et c'est le prix affiché au client qui devient faux. La publication automatique depuis Magrit supprime cette ressaisie et désigne un seul endroit où une donnée se c"},{"id":"T03.WM2","title":"Analyse commerciale et technique Shopify — GO/NO-GO","type":"story","epic":"EPIC-T03","feature":"FEAT-T03-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T03.WM2.md","summary":"Shopify est la plateforme la plus demandée : T03.1 la place en tête de l'ordre d'implémentation. C'est aussi la plus contraignante. Une intégration tierce y est encadrée par des conditions d'utilisation et un modèle économique de place de marché que Shopify fixe seul et peut modifier seul. Engager plusieurs semaines de développement avant d'avoir lu ces cond"},{"id":"T03.WM3","title":"Plugin Magento — enrichissement CMS sans remplacement","type":"story","epic":"EPIC-T03","feature":"FEAT-T03-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T03.WM1"],"decisions":[],"sourcePath":"project/backlog/stories/T03.WM3.md","summary":"Les clients sous Magento sont des gros comptes : leur catalogue représente des années de travail, de référencement et d'intégrations annexes. Leur proposer de remplacer tout cela, c'est leur proposer un projet de migration, pas un outil — et c'est perdre la vente. La stratégie d'enrichissement retourne l'argument : Magrit s'ajoute, ne remplace rien, et le co"},{"id":"T04.1","title":"T04.1 — Installation plug-in Prompt Search en moins d'une heure","type":"story","epic":"EPIC-T04","feature":"FEAT-T04-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E5.1"],"decisions":["PD-2026-10-01-B1"],"sourcePath":"project/backlog/stories/T04.1.md","summary":"Prompt Search ne se vend pas, il s'essaie. Un imprimeur qui doit mobiliser une agence pour intégrer un champ de recherche ne le fera pas : il reportera, puis renoncera. L'heure d'installation n'est pas une performance technique, c'est le seuil en dessous duquel un administrateur accepte de tester sans demander d'autorisation ni de budget. C'est la porte d'en"},{"id":"T04.2","title":"T04.2 — Compréhension d'une intention simple","type":"story","epic":"EPIC-T04","feature":"FEAT-T04-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B1"],"sourcePath":"project/backlog/stories/T04.2.md","summary":"L'acheteur professionnel sait exactement ce qu'il veut et le dit en une phrase. Le faire ensuite naviguer dans six menus déroulants pour reconstituer cette phrase est une perte de temps pure, et c'est là qu'il abandonne ou qu'il décroche son téléphone. Convertir la phrase directement en produit configuré supprime tout le parcours intermédiaire. C'est le cas "},{"id":"T04.3","title":"T04.3 — Compréhension d'une intention composée (kit / campagne)","type":"story","epic":"EPIC-T04","feature":"FEAT-T04-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B1"],"sourcePath":"project/backlog/stories/T04.3.md","summary":"Un chef de projet marketing ne pense pas en références produit, il pense en opérations : une ouverture, un salon, une tournée commerciale. Aujourd'hui il traduit lui-même cette opération en une liste de commandes, et il oublie des éléments. Magrit fait la traduction à sa place, ce qui lui fait gagner du temps et augmente le panier de l'imprimeur, parce que l"},{"id":"T04.4","title":"T04.4 — Dialogue de clarification (max 2 questions, choix visuels)","type":"story","epic":"EPIC-T04","feature":"FEAT-T04-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T04.4.md","summary":"Une demande incomplète laisse deux mauvaises options : deviner et se tromper, ou renvoyer l'acheteur à son clavier. Les deux coûtent une vente. La clarification ciblée est la troisième voie, mais elle n'a de valeur que si elle reste courte : un questionnaire de six écrans est redevenu le formulaire qu'on voulait éviter. D'où les deux bornes posées par la sou"},{"id":"T04.5","title":"T04.5 — Recherche hybride prompt + catalogue (mot-clé vs phrase)","type":"story","epic":"EPIC-T04","feature":"FEAT-T04-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B1"],"sourcePath":"project/backlog/stories/T04.5.md","summary":"Un acheteur qui tape « carte de visite » veut une liste, pas une conversation. Lui opposer une intelligence conversationnelle est une double perte : il attend plus longtemps, et il obtient moins directement ce qu'il voulait. À l'inverse, traiter une phrase complète comme trois mots-clés gâche toute la valeur de Prompt Search. La détection du type d'intention"},{"id":"T04.6","title":"T04.6 — Contexte client et mémoire (commandes passées, préférences)","type":"story","epic":"EPIC-T04","feature":"FEAT-T04-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T04.6.md","summary":"Le réassort est le gros du volume d'une boutique d'imprimeur : les mêmes cartes, les mêmes flyers, quatre fois par an. Faire réécrire la spécification complète à chaque fois est la friction la plus évitable du parcours, et celle qui fait basculer un client vers un bon de commande par courriel. Reconnaître l'habitude transforme une commande de cinq minutes en"},{"id":"T04.7","title":"T04.7 — Analytics et métriques de performance prompt","type":"story","epic":"EPIC-T04","feature":"FEAT-T04-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T04.7.md","summary":"Un imprimeur qui paie un abonnement sans savoir ce qu'il lui rapporte le résilie au premier arbitrage budgétaire. Les chiffres de conversion et de panier moyen sont donc un outil de rétention autant qu'un outil de pilotage. Côté Magrit, la carte des intentions non reconnues est la matière première de l'amélioration : chaque demande à laquelle le produit n'a "},{"id":"T05.1","title":"T05.1 — Icônes d'aide contextuelles sur champs et boutons","type":"story","epic":"EPIC-T05","feature":"FEAT-T05-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T05.1.md","summary":"Un deviseur qui hésite sur un champ ne va pas chercher la documentation : il devine, ou il appelle. Deviner produit un devis faux, appeler produit un ticket. L'aide au point d'usage supprime les deux, et elle le fait sans imposer de parcours d'accueil que les professionnels sautent systématiquement. L'effet est mesurable sur deux fronts : moins de sollicitat"},{"id":"T05.2","title":"T05.2 — Panneau d'aide de l'écran courant (raccourci ?, F1)","type":"story","epic":"EPIC-T05","feature":"FEAT-T05-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B1"],"sourcePath":"project/backlog/stories/T05.2.md","summary":"L'aide d'une infobulle explique un champ ; elle ne dit pas comment accomplir une tâche. L'utilisateur bloqué n'a pas une question de vocabulaire, il a une question de procédure : « comment je fais pour… ». Aujourd'hui, la réponse est hors de l'outil — un appel, un collègue, rien. Un panneau qui s'ouvre sur l'écran courant et qui donne le pas-à-pas garde l'ut"},{"id":"T05.3","title":"T05.3 — Aide conversationnelle Marguerite (Cmd+K)","type":"story","epic":"EPIC-T05","feature":"FEAT-T05-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T05.3.md","summary":"« Pourquoi mon budget affiche"},{"id":"T05.4","title":"T05.4 — Vidéos tutorielles embarquées (30-90 sec)","type":"story","epic":"EPIC-T05","feature":"FEAT-T05-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T05.4.md","summary":"Certaines manipulations se décrivent mal et se montrent bien : on explique en six lignes ce qu'une vidéo de quarante secondes rend évident. Pour un atelier où l'on forme des intérimaires et où le turnover est réel, la vidéo courte est le format qui passe. La contrainte de durée est ce qui fait la valeur : au-delà d'une minute et demie, personne ne regarde, e"},{"id":"T05.5","title":"T05.5 — Base de connaissance modifiable sans déploiement","type":"story","epic":"EPIC-T05","feature":"FEAT-T05-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B1"],"sourcePath":"project/backlog/stories/T05.5.md","summary":"Une question qui revient trois fois au support devrait disparaître le lendemain. Si corriger une phrase d'aide suppose une livraison, elle attend la prochaine, c'est-à-dire des semaines, et le support répond trente fois entre-temps. Découpler le contenu du code transforme l'aide d'un livrable figé en un outil que le support ajuste au fil de l'eau — c'est ce "},{"id":"T05.6","title":"T05.6 — Métriques d'utilisation de l'aide","type":"story","epic":"EPIC-T05","feature":"FEAT-T05-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T05.6.md","summary":"Une base de connaissance qu'on n'évalue pas grossit sans s'améliorer : on ajoute des contenus que personne ne lit pendant que les mêmes questions continuent d'arriver au support. Mesurer l'usage inverse la logique — on écrit là où ça coince, on corrige ce qui ne satisfait pas, on supprime ce qui ne sert pas. Le second apport dépasse la documentation : un écr"},{"id":"T06.1","title":"T06.1 — Paramétrage du parc machines (Pro+)","type":"story","epic":"EPIC-T06","feature":"FEAT-T06-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E3.4"],"decisions":["PD-2026-10-01-B3","PD-2026-10-01-B4"],"sourcePath":"project/backlog/stories/T06.1.md","summary":"Un imprimeur ne vend pas au prix du marché : il vend à son coût de revient augmenté de sa marge. Tant que son parc n'est pas renseigné, Magrit ne produit qu'un ordre de grandeur, et le deviseur refait le calcul à la main — ce qui annule le gain promis par l'outil. Le parc est aussi la matière première du reste de l'epic : sans parcs paramétrés, le prix march"},{"id":"T06.2","title":"T06.2 — Prix marché Magrit (agrégat anonymisé, k-anonymity ≥ 10)","type":"story","epic":"EPIC-T06","feature":"FEAT-T06-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T06.1"],"decisions":["PD-2026-10-01-B4"],"sourcePath":"project/backlog/stories/T06.2.md","summary":"Le prix marché est ce qui rend Magrit utile dès la première minute : un utilisateur Freemium obtient un ordre de grandeur crédible sans avoir rien paramétré, et un imprimeur Pro sait où il se situe. C'est aussi la seule valeur de repli quand une machine n'est pas encore configurée (T06.1). Mais cette valeur repose entièrement sur un pari de confiance : un im"},{"id":"T06.3","title":"T06.3 — Gestion des panels (curated + personnalisés)","type":"story","epic":"EPIC-T06","feature":"FEAT-T06-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/T06.3.md","summary":"Un acheteur industriel ne consulte pas « le marché » : il consulte ses fournisseurs référencés, ceux qui ont passé ses audits et signé ses conditions. Aujourd'hui il leur envoie dou"},{"id":"T06.4","title":"T06.4 — Comparateur multi-prix (mon prix / prix marché / prix panel)","type":"story","epic":"EPIC-T06","feature":"FEAT-T06-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T06.1","T06.2","T06.3"],"decisions":["PD-2026-10-01-B3","PD-2026-10-01-B4"],"sourcePath":"project/backlog/stories/T06.4.md","summary":"Un imprimeur qui connaît son coût ne sait pas pour autant s'il est cher. Un acheteur qui a un prix ne sait pas s'il est bon. Les trois chiffres pris isolément sont des informations ; mis côte à côte, ils deviennent une décision — accepter, négocier, renoncer. C'est la fonctionnalité qui donne sa raison d'être aux trois stories qui la précèdent : sans compara"},{"id":"T06.5","title":"T06.5 — Opt-in diffusion publicitaire Pro → Freemium","type":"story","epic":"EPIC-T06","feature":"FEAT-T06-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E7.1","T06.1"],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/T06.5.md","summary":"C'est la contrepartie économique du modèle Freemium : les utilisateurs gratuits produisent des demandes qualifiées, les imprimeurs Pro cherchent des clients, Magrit met les deux en relation et se rémunère au passage. Pour l'imprimeur, c'est de l'acquisition sans effort marketing, ciblée sur des demandes déjà formulées en termes de production. Pour la platefo"},{"id":"T06.6","title":"T06.6 — Affichage sponsor dans l'UX Freemium (CNIL-compliant)","type":"story","epic":"EPIC-T06","feature":"FEAT-T06-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T06.6.md","summary":"C'est le point où le modèle économique touche l'utilisateur. Bien fait, le bloc rend service : l'utilisateur gratuit repart avec des interlocuteurs réels au lieu d'un prix théorique. Mal fait, il détruit la raison d'être du Freemium — un écran saturé d'offres payantes n'est plus un outil de chiffrage, c'est une régie publicitaire, et l'utilisateur cesse de f"},{"id":"T06.WM1","title":"Prix marché instantané — parc ~10 imprimeurs préqualifiés","type":"story","epic":"EPIC-T06","feature":"FEAT-T06-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E1.WM2","T06.WM2"],"decisions":["PD-2026-10-01-B4"],"sourcePath":"project/backlog/stories/T06.WM1.md","summary":"C'est la réponse opérationnelle à l'impasse de T06.2 : un agrégat qui exige dix parcs actifs par famille ne produira rien pendant des mois. Un parc restreint et préqualifié, constitué à la main, donne une valeur crédible tout de suite. L'arbitrage de la séance du 12 mai 2026 est explicite : un parc plus large ralentit le calcul sans gagner en précision (Xavi"},{"id":"T06.WM2","title":"Calcul Clariprint en arrière-plan + remontée progressive UI","type":"story","epic":"EPIC-E3","feature":"FEAT-E3-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T06.WM1","E1.WM2"],"decisions":["PD-2026-10-01-B4"],"sourcePath":"project/backlog/stories/T06.WM2.md","summary":"Un chiffrage fournisseur prend entre 10 et 25 secondes — c'est une mesure, pas une estimation. Mettre l'utilisateur en attente pendant ce temps, écran figé, est le moyen le plus sûr de perdre la demande : il part, ou il recharge et on paie le calcul deux fois. La réponse n'est pas d'accélérer le fournisseur, qu'on ne contrôle pas, mais de changer l'ordre : a"},{"id":"T06.WM3","title":"Comparaison simultanée 3 prix — parc perso / marché / panel","type":"story","epic":"EPIC-T06","feature":"FEAT-T06-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T06.WM1"],"decisions":["PD-2026-10-01-B3","PD-2026-10-01-B4"],"sourcePath":"project/backlog/stories/T06.WM3.md","summary":"C'est le cadrage issu de la séance du 12 mai 2026 pour la fonctionnalité décrite par T06.4. Il apporte deux éléments que T06.4 ne porte pas : le niveau d'offre — disponibilité à partir du tier Business, situé autour de 1 000 € par mois — et l'exigence d'un accord bilatéral formalisé avant tout accès aux données d'un parc externe. Autrement dit, la comparaiso"},{"id":"T06.WM4","title":"Liens sponsorisés imprimeurs géolocalisés — Freemium monetization","type":"story","epic":"EPIC-T06","feature":"FEAT-T06-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T06.WM1"],"decisions":[],"sourcePath":"project/backlog/stories/T06.WM4.md","summary":"C'est le cadrage issu de la séance du 12 mai 2026 pour la monétisation du Freemium décrite par T06.5 et T06.6. Il apporte deux éléments que ces deux stories ne portent pas : le critère de proximité comme filtre principal — la comparaison faite en séance est celle d'un comparateur de réservation en ligne appliqué à l'impression — et une contrainte de performa"},{"id":"T07.1","title":"T07.1 — Connexion OAuth Canva Connect API","type":"story","epic":"EPIC-T07","feature":"FEAT-T07-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T07.1.md","summary":"Un acheteur qui doit sortir de la boutique pour faire son visuel ne revient pas toujours. Ouvrir Canva depuis le parcours de commande, avec le compte de l'acheteur, supprime cette rupture — et le fait sans que Magrit ait à construire un outil de création, marché déjà occupé par des acteurs qui y investissent des centaines de millions. La position produit est"},{"id":"T07.2","title":"T07.2 — Mapping gabarit Clariprint → design Canva (20 familles V1)","type":"story","epic":"EPIC-T07","feature":"FEAT-T07-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["E8.1"],"decisions":[],"sourcePath":"project/backlog/stories/T07.2.md","summary":"C'est ici que se joue l'économie réelle de l'epic Canva. Un acheteur qui compose son visuel sur un canevas générique produit un fichier inexploitable : texte coupé au massicot, pas de fonds perdus, mauvais espace colorimétrique. L'imprimeur le rattrape à la main, ou renvoie le client dessiner à nouveau. Un canevas correct dès l'ouverture supprime la majeure "},{"id":"T07.3","title":"T07.3 — Export PDF print-ready + preflight automatique","type":"story","epic":"EPIC-T07","feature":"FEAT-T07-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T07.1"],"decisions":[],"sourcePath":"project/backlog/stories/T07.3.md","summary":"C'est la story qui décide si l'epic Canva fait gagner du temps ou en coûte. Si le fichier revient sans contrôle, l'imprimeur l'ouvre, le vérifie, relance le client : le travail manuel est simplement déplacé. Le contrôle automatique à la réception transforme la chaîne — le fichier rattaché à une commande est soit utilisable en production, soit renvoyé au clie"},{"id":"T07.4","title":"T07.4 — Parcours intégré dans le storefront imprimeur","type":"story","epic":"EPIC-T07","feature":"FEAT-T07-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T07.3"],"decisions":[],"sourcePath":"project/backlog/stories/T07.4.md","summary":"Toute la chaîne Canva ne sert à rien si elle fait fuir les acheteurs qui ont déjà leur fichier, ou ceux qui veulent commander maintenant et envoyer le visuel plus tard. Un parcours qui impose Canva perd ces deux populations — souvent les clients les plus réguliers, agences et services communication, qui travaillent avec leurs propres outils. Cette story pose"},{"id":"T07.5","title":"T07.5 — Espace imprimeur — pilotage des fichiers de production","type":"story","epic":"EPIC-T07","feature":"FEAT-T07-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T07.5.md","summary":"Une commande dont le fichier n'arrive jamais ne génère ni réclamation ni alerte : elle dort. L'acheteur a ouvert Canva, s'est interrompu, et personne ne le relance. Pour l'imprimeur, c'est du chiffre d'affaires acquis puis perdu par inattention, et un planning d'atelier faussé par des commandes qui n'arriveront pas. Une vue de l'état des fichiers transforme "},{"id":"T07.WM1","title":"Étude faisabilité Canva — rapport technico-juridique GO/NO-GO","type":"story","epic":"EPIC-T07","feature":"FEAT-T07-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T07.WM1.md","summary":"Six stories de l'epic T-07 reposent sur trois hypothèses que personne n'a vérifiées : que l'API Canva permette d'ouvrir par programme un gabarit aux dimensions voulues, que la licence autorise Magrit à y déposer des gabarits issus de Clariprint, et que le fichier exporté puisse être récupéré et conservé. Si l'une des trois tombe, ce n'est pas une story à aju"},{"id":"T07.WM2","title":"Intégration Canva — ouverture gabarits Clariprint (si GO)","type":"story","epic":"EPIC-T07","feature":"FEAT-T07-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T07.WM1"],"decisions":[],"sourcePath":"project/backlog/stories/T07.WM2.md","summary":"C'est la démonstration de bout en bout de l'epic T-07 : l'acheteur clique dans Magrit, se retrouve dans Canva sur le bon gabarit, dessine, et son design revient dans Magrit. Tant que cet aller-retour n'existe pas, l'intégration Canva reste une intention. Arnaud juge l'ouverture directe des gabarits stratégique : c'est ce qui distingue Magrit d'un service qui"},{"id":"T08.A1","title":"T08.A1 — Création AO structurée (cahier des charges + critères)","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/T08.A1.md","summary":"Un AO print corporate se monte aujourd'hui dans Excel, se diffuse par email et s'arbitre en réunion. Trois conséquences : l'énoncé circule en plusieurs versions, donc les réponses ne portent pas toutes sur la même demande ; les critères de jugement ne sont écrits nulle part de façon opposable, donc l'arbitrage se discute après coup ; rien n'est réutilisable "},{"id":"T08.A2","title":"T08.A2 — Sélection panel + lancement AO + relances","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T06.3","E9.5"],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/T08.A2.md","summary":"La diffusion d'un AO est aujourd'hui du copier-coller : un email par fournisseur, une pièce jointe par email, un suivi dans un tableur pour savoir qui a répondu. C'est long, et surtout c'est faux — un fournisseur oublié dans la liste de diffusion fausse la consultation, un fichier joint en version N-1 fausse les réponses. Diffuser depuis le panel garantit qu"},{"id":"T08.A3","title":"T08.A3 — Grille de réponse fournisseur + Q&R clarifications","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T08.A3.md","summary":"Quand chaque fournisseur répond dans son propre tableau, l'acheteur passe plus de temps à remettre les offres au même format qu'à les comparer — et toute erreur de remise à plat se paie sur un marché. Une grille imposée rend les réponses comparables dès leur dépôt : c'est la condition d'existence du comparateur T08.A4. Le fil de clarifications, lui, traite l"},{"id":"T08.A4","title":"T08.A4 — Comparateur multi-critères (prix / délai / RSE / qualité)","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T08.A4.md","summary":"Le moins-disant n'est pas toujours le bon choix, et une direction achats doit pouvoir le démontrer. Aujourd'hui l'arbitrage se fait sur un tableau refait à la main, avec des pondérations implicites que personne ne retrouve six mois plus tard devant un auditeur. Poser les pondérations avant le dépouillement et calculer le score transforme l'arbitrage en résul"},{"id":"T08.A5","title":"T08.A5 — Workflow validation interne + dossier d'attribution signé","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T08.A5.md","summary":"Che"},{"id":"T08.B1","title":"T08.B1 — Import Excel massif (XLSX/XLS/CSV, 50k lignes)","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T08.B1.md","summary":"Un catalogue de 3 500 références print resaisi manuellement, c'est plusieurs semaines de travail et un taux d'erreur garanti sur des données qui servent ensuite à chiffrer. Tant que l'entrée du catalogue passe par la saisie, Magrit n'est pas utilisable par un annonceur grand compte : son référentiel vit dans Excel et y restera. La source rattache expliciteme"},{"id":"T08.B2","title":"T08.B2 — Mapping intelligent des colonnes + profils réutilisables","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T08.B2.md","summary":"Un catalogue chargé mais dont on ignore quelle colonne porte le prix ne sert à rien. Le mapping est l'étape qui transforme un tableur en données exploitables, et c'est aussi celle qui décourage : refait à la main à chaque import, il coûte une demi-journée deux fois par an et se trompe une fois sur deux. Mémoriser le mapping sous forme de profil réutilisable "},{"id":"T08.B3","title":"T08.B3 — Réconciliation catalogue (création / modification / suppression / conflit)","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T08.B3.md","summary":"Un import qui s'applique directement est un import qu'on n'ose pas lancer. Entre deux versions d'un catalogue, il y a des créations attendues, des mises à jour de prix voulues — et des suppressions involontaires dues à une ligne mal recopiée. La réconciliation rend ces trois catégories visibles avant l'écriture : c'est ce qui transforme l'import de catalogue"},{"id":"T08.B4","title":"T08.B4 — Publication catalogue + versioning + notification imprimeurs","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T08.B4.md","summary":"Entre « les changements sont validés » et « tout le monde travaille sur la bonne version », il y a une"},{"id":"T08.B5","title":"T08.B5 — Détection anomalies + connecteur PIM (Akeneo, Salsify)","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.B1","T08.B2","T08.B3","T08.B4"],"decisions":[],"sourcePath":"project/backlog/stories/T08.B5.md","summary":"Un prix à 0,01 €, un format incohérent ou deux lignes pour le même SKU ne se voient pas dans un tableur de 3 500 lignes : ils se voient dans le devis envoyé au client. Détecter ces anomalies au moment de l'import, c'est le dernier filet avant que la donnée fausse devienne un engagement commercial. Le connecteur PIM répond à l'autre moitié du problème : che"},{"id":"T08.N1","title":"T08.N1 — Ingestion fidèle du fichier source (binaire, multi-feuilles, fusions)","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T08.N1.md","summary":"Tout ce que la chaîne fait ensuite — typer, normaliser, mapper, chiffrer, restituer — repose sur ce que cette étape a lu. Si elle perd des lignes, les pertes ne se voient pas : elles se traduisent par un bordereau rendu incomplet, donc une réponse disqualifiée. La source documente précisément l'incident fondateur : une lecture par représentation textuelle a "},{"id":"T08.N10","title":"T08.N10 — Mapping ligne normalisée → produit Clariprint chiffrable (grand format inclus)","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N9"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N10.md","summary":"Normaliser ne suffit pas : tant qu'une ligne n'est pas rattachée à un produit du catalogue, elle n'a pas de prix. C'est ici que la chaîne bascule de la lecture au chiffrage. La source insiste sur un point qui a valeur de correction : Clariprint traite l'essentiel des gammes, y compris le grand format et la signalétique — Dibond, Akilux, carton plume, PVC, bâ"},{"id":"T08.N11","title":"T08.N11 — Génération des variantes & arbitrage des ambiguïtés","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N8","T08.N10"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N11.md","summary":"Un bordereau qui demande un prix « avec ou sans lamination » attend deux prix. Rendre un seul, c'est une réponse incomplète ; en rendre huit, c'est une réponse illisible. Cette story est ce qui fait correspondre le nombre de prix produits au nombre de prix demandés, et c'est aussi celle qui empêche la combinatoire de s'emballer sur une ligne portant trois op"},{"id":"T08.N12","title":"T08.N12 — Chiffrage en masse via Magrit Core","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N10","T08.N11"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N12.md","summary":"C'est l'étape qui justifie toute la chaîne. Chiffrer 234 lignes à la main prend des jours et interdit de répondre à un appel d'offres volumineux dans les délais ; les chiffrer en une passe, en moins d'une minute, change la nature de ce que l'imprimeur peut accepter de traiter. La contrainte structurante posée par la source est de réutiliser le moteur de prix"},{"id":"T08.N13","title":"T08.N13 — Restitution d'un fichier de structure comparable à l'origine","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N1","T08.N9","T08.N12"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N13.md","summary":"Le livrable d'un appel d'offres n'est pas un tableau de prix : c'est le bordereau de l'émetteur, rendu dans une forme qu'il sait ingérer. Toute dérive de structure le rend inexploitable et peut disqualifier la réponse. Tout ce que la chaîne a produit en amont n'a de valeur commerciale qu'à travers ce fichier : c'est le seul artefact que le client voit."},{"id":"T08.N14","title":"T08.N14 — Interface de revue humaine (confiance, validation, édition)","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N9","T08.N10"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N14.md","summary":"Aucune des étapes de normalisation n'est fiable à 100 %, et elles ne le seront pas : les façonnages exotiques, les supports hors catalogue et les combinatoires existeront toujours. Sans cet écran, la seule issue d'une ligne mal lue est de corriger le fichier Excel et de tout recommencer — ce qui annule le gain de la chaîne. C'est la story qui rend les imperf"},{"id":"T08.N2","title":"T08.N2 — Détection de structure (catégories, en-têtes, lignes produit, pied)","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N1"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N2.md","summary":"Un bordereau n'est pas une table de données : c'est une mise en page. Tant que Magrit ne sait pas distinguer un bandeau de catégorie d'une ligne de produit, il chiffre des intitulés et ignore des articles. C'est cette étape qui détermine le dénominateur de tout le reste : le nombre de lignes à chiffrer, donc le nombre de prix attendus dans la réponse. Sur le"},{"id":"T08.N3","title":"T08.N3 — Résolution des fusions et report (fill-down) des attributs hérités","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N1","T08.N2"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N3.md","summary":"Dans un bordereau, la catégorie est écrite une fois et vaut pour les quarante lignes qui suivent ; le format ou le papier commun à un bloc le sont aussi. Lue ligne par ligne, cette information disparaît : la ligne 37 n'a plus de catégorie. C'est exactement ce qui avait faussé le premier comptage du cas de référence. Reporter ces valeurs est une opération sim"},{"id":"T08.N4","title":"T08.N4 — Mapping de colonnes sémantique (auto + profil par donneur d'ordre)","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N2","T08.N3"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N4.md","summary":"C'est la story qui décide si le produit tient à l'échelle. Si le rôle des colonnes doit être redéclaré à chaque appel d'offres, la chaîne n'est qu'un script jetable ; s'il est deviné puis mémorisé par émetteur, Magrit devient utilisable sur n'importe quel bordereau. La source le formule comme un principe d'architecture produit : le bordereau du Groupe ICI es"},{"id":"T08.N5","title":"T08.N5 — Normaliseur Quantités","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N4"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N5.md","summary":"Une quantité est l'entrée principale d'un calcul de prix : si elle est mal lue, le prix est faux, et un prix faux dans une réponse à appel d'offres engage l'imprimeur. Or les émetteurs écrivent 3000 ex., 5 000 ex., 1ex et 6 rouleaux de 100 ex. dans la même colonne. Cette story est le point où l'hétérogénéité d'écriture cesse d'être un problème pour tout l'av"},{"id":"T08.N6","title":"T08.N6 — Normaliseur Formats","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N4"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N6.md","summary":"Le format conditionne le calcul d'imposition, donc le prix. Un bordereau mélange des notations incompatibles dans la même colonne : 210×297, Diamètre : 40, Format fermé : 297×210 / ouvert : 594×420, 2400×1600. Si Magrit ne distingue pas le format fermé du format ouvert sur un dépliant, il chiffre une surface fausse — et sur du grand format, l'écart se compte"},{"id":"T08.N7","title":"T08.N7 — Normaliseur Support / Papier","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N4"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N7.md","summary":"Le support est, avec la quantité et le format, l'un des trois déterminants du prix. Un bordereau le désigne en langage d'atelier : RESPECTA … 115g, Dibond 3 mm, PVC blanc 760µ, Bâche 270 g/m². Tant que ces libellés restent du texte, aucune correspondance avec le catalogue n'est possible et aucune ligne n'est chiffrable. Cette story est la condition du mappin"},{"id":"T08.N8","title":"T08.N8 — Normaliseur Façonnage (vocabulaire métier → options)","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N4"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N8.md","summary":"Le façonnage est la partie du bordereau écrite en langage d'imprimeur, et c'est aussi celle qui porte les options : « avec ou sans lamination », « en option dos carré collé ». Mal lue, elle produit deux erreurs coûteuses : un prix sans une finition facturée, ou un prix manquant parce que le bordereau en attendait deux. C'est la story qui décide combien de pr"},{"id":"T08.N9","title":"T08.N9 — Modèle « ligne AO normalisée » + export référentiel","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.N5","T08.N6","T08.N7","T08.N8"],"decisions":[],"sourcePath":"project/backlog/stories/T08.N9.md","summary":"C'est l'étape où la chaîne devient vérifiable. Tant que la normalisation vit en mémoire, personne ne peut dire si Magrit a bien compris le bordereau. Un référentiel lisible, où chaque ligne porte une référence et son numéro de ligne d'origine, permet à l'imprimeur de relire avant de chiffrer, de transmettre à un collègue, et de retrouver d'où vient une valeu"},{"id":"T08.WM1","title":"Module AO — Création et envoi d'appels d'offres","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T06.WM1","T08.WM3"],"decisions":["PD-2026-10-01-B4"],"sourcePath":"project/backlog/stories/T08.WM1.md","summary":"La source situe le besoin che"},{"id":"T08.WM2","title":"[SUPERSEDÉE → T08.N1–N14] Module AO — Import et traitement fichiers Excel de réponse","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/T08.WM2.md","summary":"Elle n'est plus portée ici. L'enjeu — transformer un fichier de réponse ou un bordereau de prix unitaires reçu au format tableur en lignes exploitables et chiffrables — est intégralement repris par T08.N1 à T08.N14, avec un niveau de détail que cette story n'avait pas."},{"id":"T08.WM3","title":"Module AO — Affichage prix marché avant contact imprimeurs","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T06.WM1","T08.WM1"],"decisions":["PD-2026-10-01-B4"],"sourcePath":"project/backlog/stories/T08.WM3.md","summary":"Un donneur d'ordre qui lance une consultation sans ordre de grandeur part aveugle : il ne sait ni si son budget tient, ni si les prix reçus sont bons. Il consulte donc « pour voir », mobilise des imprimeurs pour rien, et découvre tard que le projet n'était pas finançable. Afficher le prix marché avant l'envoi inverse la séquence : le budget se valide d'abord"},{"id":"T08.WM4","title":"Module AO dissocié en add-on vendable dès Starter+","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":["T08.WM1","T08.WM2"],"decisions":[],"sourcePath":"project/backlog/stories/T08.WM4.md","summary":"Le module AO est aujourd'hui positionné sur le seul palier Enterprise, alors que la demande terrain vient aussi de structures plus petites — courtiers, consultants, imprimeurs qui redistribuent. Les enfermer dans le palier le plus cher revient à ne pas vendre. En faire une option activable dès un palier d'entrée ouvre un deuxième chemin de revenu, sans refai"},{"id":"US-AO-05","title":"App « Gestion AO » standalone","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-AO-05.md","summary":"Un client qui veut traiter ses appels d'offres n'a pas forcément besoin du reste de Magrit, et n'a pas forcément le droit de voir ses données partir ailleurs. Une application AO autonome ouvre deux portes : vendre le module seul à des acteurs qui ne sont pas des imprimeurs, et le déployer che"},{"id":"US-AO-06","title":"Pipeline AO : ingestion → chiffrage → restitution","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-AO-06.md","summary":"La valeur de ce chantier ne tient pas dans une étape mais dans leur enchaînement. Un acheteur envoie son bordereau dans son format ; il veut le récupérer chiffré dans son format. Tout ce qui se passe entre les deux — nettoyage, normalisation, mise en correspondance avec un référentiel, chiffrage — lui est indifférent, et c'est précisément le travail que l'im"},{"id":"US-AO-07","title":"Fiabilisation de l'ingestion des fichiers AO","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-AO-07.md","summary":"La source cite un incident précis : 55 produits traités sur 250. Une troncature silencieuse est le pire défaut possible pour ce module — l'utilisateur obtient un résultat plausible, le transmet, et découvre l'écart che"},{"id":"US-AO-08","title":"Plugin Excel AO sur le store Microsoft","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-AO-08.md","summary":"Les appels d'offres print vivent dans Excel et continueront d'y vivre. Demander à l'utilisateur de quitter son fichier pour obtenir un prix est un frein à chaque ligne ; le lui donner dans sa feuille supprime le frein. La source décrit un module déjà existant — « clé → calcul serveur Clariprint » : il ne s'agit pas de le construire mais de le distribuer. Pas"},{"id":"US-AO-09","title":"Parc machine de démonstration AO","type":"story","epic":"EPIC-T08","feature":"FEAT-T08-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-01-B3"],"sourcePath":"project/backlog/stories/US-AO-09.md","summary":"Une démo de module AO sans prix ne démontre rien : c'est le chiffrage qui fait la preuve. Or un prix réel suppose un parc machines paramétré, ce qui prend deux à trois heures che"},{"id":"US-CONV-01","title":"Agent conversationnel dédié","type":"story","epic":"EPIC-E2","feature":"FEAT-E2-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-CONV-01.md","summary":"Tant que la compréhension du client et le calcul métier sont mêlés, chaque ajustement de ton ou de dialogue risque de déplacer un prix, et chaque évolution de la règle de chiffrage oblige à retoucher la conversation. Les séparer permet de faire progresser le dialogue vite et souvent, sans remettre en jeu la justesse des devis — là où une erreur se paie che"},{"id":"US-CONV-02","title":"API copilote Studio (brief → product card → prix)","type":"story","epic":"EPIC-E5","feature":"FEAT-E5-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"implemented","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":["PD-2026-10-05-HOPESTUDIO"],"sourcePath":"project/backlog/stories/US-CONV-02.md","summary":"Vérifier que le parcours existant peut transformer un brief métier en carte produit tarifée, puis transmettre cette carte à Magrit. Le statut P0 vient de la source ; le statut de livraison importé ne signifie pas que l’intégration HopeStudio est absente."},{"id":"US-CORE-01","title":"Socle Magrit Core (plateforme de service)","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-CORE-01.md","summary":"Magrit ne se résume plus à un configurateur : s'y ajoutent une gestion commerciale, un catalogue produit, un gestionnaire de médias, des briques de production. Si chacune se construit en modifiant le cœur, chaque ajout ralentit le suivant et chaque équipe attend les autres. Un socle qui porte une fois pour toutes les espaces, les utilisateurs, les droits et "},{"id":"US-CORE-02","title":"Dépôts séparés (1 core + 1 par app)","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-CORE-02.md","summary":"Quand tout vit dans un seul dépôt, chaque équipe hérite du contexte des autres : des revues qui ne la concernent pas, des conflits sur des fichiers qu'elle n'a pas touchés, et une responsabilité diluée sur ce qui casse. Séparer les dépôts donne à chaque équipe un périmètre qu'elle tient réellement, et rend possible de confier une application à un partenaire "},{"id":"US-CORE-03","title":"CI/CD GitHub Actions & traçabilité des agent runs","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-CORE-03.md","summary":"Deux risques distincts, qu'une même discipline couvre. Le premier est la régression silencieuse : sans barrière automatique, une anomalie entre dans la branche de référence et c'est la recette manuelle, plusieurs jours plus tard, qui la découvre — au prix d'une enquête. Le second est propre à un projet où une grande partie du code est produite par des agents"},{"id":"US-CORE-04","title":"Reprise from scratch sur cahier des charges stack","type":"story","epic":"EPIC-E7","feature":"FEAT-E7-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-CORE-04.md","summary":"Un choix de socle technique engage dix ans de maintenance et conditionne qui pourra reprendre le code. Quand il est pris sans trace écrite, deux choses se perdent : la capacité à le défendre devant un tiers — client, investisseur, nouveau développeur — et la capacité à le réviser, parce qu'on ne sait plus ce qu'on avait écarté ni pourquoi. Écrire la justific"},{"id":"US-DEMO-01","title":"Module JS pont API « prix réel Clariprint »","type":"story","epic":"EPIC-E5","feature":"FEAT-E5-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-DEMO-01.md","summary":"En démonstration, un prix estimé se voit. L'interlocuteur est imprimeur : il sait ce que coûte ce qu'il regarde, et un chiffre approximatif discrédite tout le reste de la présentation. Montrer un prix réellement calculé par le fournisseur change la nature de la démonstration — on ne montre plus une maquette qui simule un chiffrage, on montre un produit qui c"},{"id":"US-DEMO-02","title":"Gestion de la latence (~30 s) en démo","type":"story","epic":"EPIC-E3","feature":"FEAT-E3-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-DEMO-02.md","summary":"En démonstration, trente secondes de silence ne se rattrapent pas. L'interlocuteur n'y voit pas une latence technique : il y voit un produit qui ne marche pas, et la suite de la présentation se joue contre cette impression. La latence ne sera pas supprimée d'ici là — elle vient de l'interprétation de la demande, hors du contrôle de Magrit. Ce qui peut l'être"},{"id":"US-INT-05","title":"Extraction données ERP (Cadratin / Kojilog)","type":"story","epic":"EPIC-E5","feature":"FEAT-E5-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-INT-05.md","summary":"Avant de connecter quoi que ce soit, il faut savoir ce que contient l'outil en place : quelles références, quelle qualité, quelles lacunes. Un export tabulaire configurable répond à cette question pour un coût proche de"},{"id":"US-METH-01","title":"Documentation & sprints centralisés dans Git","type":"story","epic":"EPIC-E9","feature":"FEAT-E9-UNCLASSIFIED","specStatus":"draft","deliveryStatus":"not-started","lifecycleStatus":null,"owner":"unassigned","dependencies":[],"decisions":[],"sourcePath":"project/backlog/stories/US-METH-01.md","summary":"Quand la documentation vit ailleurs que le code, elle vieillit sans que personne ne le voie : une story décrit un comportement que le dépôt a cessé d'avoir depuis trois mois, et on ne s'en aperçoit qu'en la relisant. Tenir les deux ensemble rend l'écart visible au moment où il se crée, soumet la documentation aux mêmes revues que le code, et permet de dire c"}],"openQuestions":[{"id":"OQ-B2","question":"Les champs d'un produit administré sont-ils verrouillés, ou une modification libre doit-elle déclencher un recalcul Clariprint ?","source":"MEET-2026-10-01-ATELIER","owner":"à nommer","due":"à fixer","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-B3-PARC","question":"Comment un sous-espace est-il rattaché à un parc machines et quels droits le groupe exerce-t-il sur ses filiales ? Bloque 15 stories des epics T-01, T-02, E9 et T-06.","source":"MEET-2026-10-01-ATELIER","owner":"à nommer","due":"à fixer","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-GOV-ROLES","question":"Compléter les approbateurs produit et technique hors HopeStudio, dont le périmètre est porté par Xavier ; préciser la validation des points produit non structurants de Magrit.","source":"MEET-2026-10-01-ATELIER","owner":"Arnaud Mazon / Xavier Péchoultres","due":"à fixer","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-UM-PORTABLE","question":"Formaliser la décision UM historique : trace validée du 14/08 et séparation des populations confirmée par le RP du 28/08. Compléter les sources des options/droits et vérifier les chemins legacy ainsi que les garanties en base portable.","source":"PD-2026-10-05-UM","owner":"à nommer","due":"avant approbation des stories de droits","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-ARCH-C3","question":"Quels workers sont conservés, fusionnés ou supprimés après inventaire ?","source":"MEET-2026-10-01-ATELIER","owner":"Xavier Péchoultres","due":"à fixer","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-PROD-B6-B7","question":"Quels arbitrages complémentaires sont requis pour Studio et le panier ? Distinguer le périmètre HopeStudio porté par Xavier des règles du panier Magrit.","source":"MEET-2026-10-01-ATELIER","owner":"Xavier Péchoultres pour HopeStudio ; responsable panier à nommer","due":"à fixer","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-RENOUVELLEMENT-PRIX","question":"« Commander à nouveau » rejoue-t-il le prix payé, ou propose-t-il le prix du jour ? Le prix du jour est déjà en service avec un avertissement au panier, sans avoir été arbitré.","source":"Session boutique 19-20/09/2026, relevé Q-ARBITRAGES","owner":"Arnaud Mazon","due":"à fixer","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-Q24-RETROFIT-VALIDITE","question":"Les espaces existants passent-ils à 30 jours de validité de devis ? Et un devis sans date de fin est-il un cas légitime ? En base, rien ne distingue « jamais décidé » de « décidé sans terme ». À vérifier d'abord : ADR-2026-10-01-C5 ne conserve pas les données historiques, la question peut être sans objet.","source":"Session boutique 19-20/09/2026, relevé Q-ARBITRAGES","owner":"Arnaud Mazon","due":"à fixer","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-Q19-ACQUITTER","question":"Acquitter un prix non vérifié doit-il être réservé à une population plus étroite que valider une commande ? Livré fermé par défaut : qui peut valider peut acquitter. Un mot suffit à fermer le sujet, aucun code à changer.","source":"Session boutique 19-20/09/2026, relevé Q-ARBITRAGES","owner":"Arnaud Mazon","due":"à fixer","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-Q16-PERSONNALISER","question":"Le bouton « Personnaliser » est actif sur toutes les cartes et n'écrit qu'un message en console. Le retirer, ou le griser avec un motif visible comme le bouton panier de Q14-a ? L'infobulle « à venir » qu'il porte ne se lit pas au tactile.","source":"Session boutique 19-20/09/2026, relevé Q-ARBITRAGES","owner":"Arnaud Mazon","due":"à fixer","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-OUTILLAGE-RENDU","question":"Le dépôt doit-il se doter d'une bibliothèque permettant d'observer ce qu'un écran affiche ? Il n'en a aucune : les vérifications lisent le texte du code source, et un commentaire les trompe. Quatre défauts de ce type sur le seul chantier boutique, dont un vivant dans la branche principale.","source":"Session boutique 19-20/09/2026, relevé Q-ARBITRAGES","owner":"Xavier Péchoultres","due":"à fixer","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-PIM-KAKEMONO","question":"La gamme kakémono manque-t-elle réellement au référentiel produit, et le rattachement produit vers gamme est-il fiable au-delà du client pilote ? Part générique extraite de l'audit EPIM.audit-classification-ERAM, retiré du backlog le 04/10/2026.","source":"Constat ERAM du 11/05/2026","owner":"à nommer","due":"à fixer","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-MONETISATION-PALIERS","question":"Le changement de palier d'offre est aujourd'hui ouvert à tout administrateur d'un espace, sans paiement : magrit.updatetenantsettings protège l'identifiant d'URL mais pas le champ plan. À fermer lors de l'implantation du modèle de monétisation. Tant que c'est ouvert, aucun plafond par offre n'est opposable (E7.5, E7.WM1, E9.8).","source":"Passe de qualité du 03/10/2026","owner":"Arnaud Mazon","due":"implantation du modèle de monétisation","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-HS-PIM-FORM","question":"Quelles données PIM et HopeStudio alimentent le formulaire produit, avec quelles priorités et quel comportement de mise à jour ? Rapprocher E1.2/Q20/B1 avant une nouvelle story.","source":"PD-2026-10-05-HOPESTUDIO","owner":"Xavier Péchoultres","due":"avant cadrage du lot formulaire","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-HS-SHOP-CHAT","question":"Quel parcours de chat activer en boutique, pour quels utilisateurs et quelle destination des résultats : panier, devis ou autre ? Rapprocher E4.1/E4.2.","source":"PD-2026-10-05-HOPESTUDIO","owner":"Xavier Péchoultres pour HopeStudio ; consulter le responsable boutique","due":"avant cadrage du lot boutique","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-HS-MARGINS","question":"Les coûts de production HopeStudio reçoivent-ils les marges attendues jusqu’au devis et, ensuite, en boutique ? HopeStudio ne fournit pas la gamme. L’ajout manuel est vérifié pour les marges globales/client ; définir le rattachement PIM éventuel et le callback de prix affiché décrit dans E1.WM1.","source":"PD-2026-10-05-HOPESTUDIO","owner":"Xavier Péchoultres pour le diagnostic ; règles commerciales avec leur responsable","due":"avant validation du parcours de prix concerné","status":"ouverte","sourcePath":"project/decisions/open-questions.md"},{"id":"OQ-PIM-TERMINOLOGIE","question":"Remplacer le terme « gamme » utilisé pour le classement des produits par « catégorie de produits », ou un autre terme à retenir ? Xavier signale que « gamme » évoque d’abord la gamme de fabrication dans le métier print.","source":"Précision de Xavier dans le chat du 05/10/2026","owner":"Xavier Péchoultres pour la proposition ; arbitrage du vocabulaire produit au WM","due":"prochain WM","status":"ouverte","sourcePath":"project/decisions/open-questions.md"}],"decisions":[{"id":"ADR-2026-10-06-COMMANDES-LECTURE","title":"Lecture commune des commandes — pagination, détail et export","date":"2026-10-06","documentStatus":"approved","decisionStatus":"adopted","sourcePath":"project/decisions/architecture/ADR-2026-10-06-commandes-lecture-commune.md","summary":"La décision produit PD-2026-10-05-COMMANDES-UNIQUE reconnaît un objet Commande unique. Son stockage est déjà commun. Le dashboard charge encore deux API et les clients des commandes devis séparément, limite les commandes boutique à 100 résultats et applique les filtres côté navigateur. Xavier demande le 6 octobre de poursuivre la liste unique, les filtres et"},{"id":"PD-2026-10-06-COMMANDES-STATUT-UNIQUE","title":"Commande : un seul statut visible, cycle administratif interne","date":"2026-10-06","documentStatus":"approved","decisionStatus":"adopted","sourcePath":"project/decisions/product/PD-2026-10-06-commandes-statut-unique.md","summary":"- L'utilisateur voit un seul Statut sur la liste et la fiche commande. - Pour une commande active et validée, ce statut visible est son étape de production courante. - Les états administratifs exceptionnels remplacent l'étape dans l'affichage : draft devient « Brouillon », cancelled devient « Annulée » et closed devient « Clôturée ». Une commande validée san"},{"id":"PD-2026-10-05-COMMANDES-UNIQUE","title":"Commande : un objet métier et un parcours back-office uniques","date":"2026-10-05","documentStatus":"approved","decisionStatus":"adopted","sourcePath":"project/decisions/product/PD-2026-10-05-commandes-objet-unique.md","summary":"- Il existe un seul objet métier Commande dans Magrit. - Une commande porte une origine (boutique ou devis) et les références propres à cette origine. L'origine est une donnée, pas une frontière de navigation. - Les workflows de création restent distincts. Les règles de validation d'un panier et de conversion d'un devis ne sont pas fusionnées. - Le back-offi"},{"id":"PD-2026-10-05-HOPESTUDIO","title":"HopeStudio : parcours chat vers devis validé côté Magrit et travaux restants","date":"2026-10-05","documentStatus":"approved","decisionStatus":"adopted","sourcePath":"project/decisions/product/PD-2026-10-05-HopeStudio-parcours-valide-et-suite.md","summary":""},{"id":"PD-2026-10-05-UM","title":"Modèle de droits utilisateurs — consolidation UM et écarts de la stack portable","date":"2026-10-05","documentStatus":"draft","decisionStatus":"proposed","sourcePath":"project/decisions/product/PD-2026-10-05-UM-droits-utilisateurs.md","summary":""},{"id":"PD-2026-10-04-B3-FRANCHISE","title":"Modèle d'entités d'un réseau de franchise","date":"2026-10-04","documentStatus":"draft","decisionStatus":"adopted","sourcePath":"project/decisions/product/PD-2026-10-04-B3-franchise-tete-de-reseau.md","summary":"La tête de réseau est un tenant. Chaque franchisé est un sous-espace de ce tenant."},{"id":"ADR-2026-10-01-C1","title":"Exécution côté serveur sans fonctions Edge Supabase","date":"2026-10-01","documentStatus":"draft","decisionStatus":"adopted","sourcePath":"project/decisions/architecture/ADR-2026-10-01-C1-execution-serveur.md","summary":""},{"id":"ADR-2026-10-01-C2","title":"Socle de développement local","date":"2026-10-01","documentStatus":"draft","decisionStatus":"adopted","sourcePath":"project/decisions/architecture/ADR-2026-10-01-C2-developpement-local.md","summary":""},{"id":"ADR-2026-10-01-C4","title":"Contrat d'API unique","date":"2026-10-01","documentStatus":"draft","decisionStatus":"adopted","sourcePath":"project/decisions/architecture/ADR-2026-10-01-C4-contrat-api.md","summary":""},{"id":"ADR-2026-10-01-C5","title":"Schéma de base regroupé et assaini","date":"2026-10-01","documentStatus":"draft","decisionStatus":"adopted","sourcePath":"project/decisions/architecture/ADR-2026-10-01-C5-schema-base.md","summary":""},{"id":"ADR-2026-10-01-C6","title":"Évolution du kit d'interface","date":"2026-10-01","documentStatus":"draft","decisionStatus":"deferred","sourcePath":"project/decisions/architecture/ADR-2026-10-01-C6-kit-interface.md","summary":""},{"id":"PD-2026-10-01-B1","title":"Recherche unifiée","date":"2026-10-01","documentStatus":"draft","decisionStatus":"adopted","sourcePath":"project/decisions/product/PD-2026-10-01-B1-recherche-unifiee.md","summary":"Magrit présente une seule barre combinant recherche et prompt. L'origine des données devient une métadonnée de la carte produit. La première mise en œuvre doit : - chercher rapidement des suggestions par recherche vectorielle dans le PIM et les afficher dans l'interface de discussion ; - chercher en parallèle le produit métier le plus proche dans la base sta"},{"id":"PD-2026-10-01-B3","title":"Modèle de sous-traitance","date":"2026-10-01","documentStatus":"draft","decisionStatus":"adopted","sourcePath":"project/decisions/product/PD-2026-10-01-B3-sous-traitance.md","summary":"Le sous-espace représente la filiale d'un groupe au sein d'un tenant. Le tenant est l'unité de facturation et de fonctionnement. La sous-traitance relie deux unités, qu'elles appartiennent ou non au même groupe. Les données d'un parc machines restent che"},{"id":"PD-2026-10-01-B4","title":"Conservation du prix marché","date":"2026-10-01","documentStatus":"draft","decisionStatus":"adopted","sourcePath":"project/decisions/product/PD-2026-10-01-B4-prix-marche.md","summary":""},{"id":"PD-2026-10-01-B5","title":"Création directe d'un devis","date":"2026-10-01","documentStatus":"draft","decisionStatus":"adopted","sourcePath":"project/decisions/product/PD-2026-10-01-B5-devis-direct.md","summary":""}],"meetingDocuments":[{"id":"MEET-2026-10-01-ATELIER","kind":"meeting","path":"project/meetings/2026/2026-10-01-atelier-arbitrage-backlog.md","processingStatus":"review","owner":"unassigned","
