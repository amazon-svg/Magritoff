name: magritoff-preprod

x-runtime: &runtime
  image: magritoff-preprod-app:${MAGRIT_RELEASE:-local}
  build:
    context: .
    dockerfile: infra/preprod/Dockerfile
    target: app
  init: true
  restart: unless-stopped
  networks: [preprod]
  environment: &runtime-env
    NODE_ENV: production
    MAGRIT_API_HOST: 0.0.0.0
    MAGRIT_API_PORT: 8787
    DATABASE_URL: postgresql://magrit_api_login:${API_DATABASE_PASSWORD:?secret requis}@postgres:5432/magrit
    MAGRIT_POSTGRES_POOL_MAX: 5
    APP_BASE_URL: ${APP_BASE_URL:?URL requise}
    MAGRIT_PUBLIC_APP_URL: ${APP_BASE_URL:?URL requise}
    MAGRIT_AUTH_SECRET: ${MAGRIT_AUTH_SECRET:?secret requis}
    MAGRIT_RATE_LIMIT_IP_HMAC_SECRET: ${MAGRIT_RATE_LIMIT_IP_HMAC_SECRET:?secret requis}
    MAGRIT_TRUSTED_PROXIES: ${MAGRIT_TRUSTED_PROXIES:-172.29.80.1/32}
    S3_ENDPOINT: ${S3_ENDPOINT:?URL requise}
    S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?URL requise}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?secret requis}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?secret requis}
    S3_REGION: us-east-1
    S3_FORCE_PATH_STYLE: 'true'
    MAGRIT_FROM_EMAIL: ${MAGRIT_FROM_EMAIL:-Magrit <noreply@magrit.local>}
    MAIL_HOST: mail
    MAIL_PORT: 1025
    MAIL_SECURE: 'false'
  depends_on:
    postgres: {condition: service_healthy}
    s3: {condition: service_healthy}
    mail: {condition: service_started}

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    networks: [preprod]
    environment:
      POSTGRES_DB: magrit
      POSTGRES_USER: magrit_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?secret requis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U magrit_owner -d magrit']
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *runtime
    restart: 'no'
    profiles: [tools]
    environment:
      MAGRIT_DATABASE_MIGRATION_URL: postgresql://magrit_owner:${POSTGRES_PASSWORD:?secret requis}@postgres:5432/magrit
    command: [node, scripts/db/migrate.mjs]

  bootstrap-logins:
    image: postgres:17.11-bookworm
    profiles: [tools]
    networks: [preprod]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?secret requis}
      API_PASSWORD: ${API_DATABASE_PASSWORD:?secret requis}
      WORKER_PASSWORD: ${WORKER_DATABASE_PASSWORD:?secret requis}
    volumes:
      - ./infra/preprod/bootstrap-logins.sql:/bootstrap-logins.sql:ro
    entrypoint: [sh, -ec]
    command:
      - >-
        psql -h postgres -U magrit_owner -d magrit -v ON_ERROR_STOP=1
        --set=api_password="$${API_PASSWORD}"
        --set=worker_password="$${WORKER_PASSWORD}"
        -f /bootstrap-logins.sql

  api:
    <<: *runtime
    ports: ['127.0.0.1:${MAGRIT_API_LOCAL_PORT:-18787}:8787']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: magritoff-preprod-web:${MAGRIT_RELEASE:-local}
    build:
      context: .
      dockerfile: infra/preprod/Dockerfile
      target: web
    restart: unless-stopped
    networks: [preprod]
    ports: ['127.0.0.1:${MAGRIT_WEB_LOCAL_PORT:-18080}:8080']

  notifications:
    <<: *runtime
    environment: &worker-env
      <<: *runtime-env
      DATABASE_URL: postgresql://magrit_worker_login:${WORKER_DATABASE_PASSWORD:?secret requis}@postgres:5432/magrit
    command: [node, --import, tsx, src/server/node/notification-worker-main.ts]

  outbox:
    <<: *runtime
    environment: *worker-env
    command: [node, --import, tsx, src/server/node/outbox-worker-main.ts]

  exports:
    <<: *runtime
    environment: *worker-env
    command: [node, --import, tsx, src/server/node/order-export-worker-main.ts]

  purge:
    <<: *runtime
    environment: *worker-env
    command: [node, --import, tsx, src/server/node/order-file-purge-worker-main.ts]

  s3:
    image: chrislusf/seaweedfs:4.48
    command: [mini, '-dir=/data']
    restart: unless-stopped
    networks: [preprod]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?secret requis}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?secret requis}
    ports: ['127.0.0.1:${MAGRIT_S3_LOCAL_PORT:-18333}:8333']
    volumes: [s3-data:/data]
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 30

  s3-init:
    <<: *runtime
    profiles: [tools]
    restart: 'no'
    environment:
      MAGRIT_DEV_S3_ENDPOINT: http://s3:8333
      MAGRIT_DEV_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?secret requis}
      MAGRIT_DEV_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?secret requis}
    command: [node, scripts/infra/ensure-s3-buckets.mjs]

  mail:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    networks: [preprod]
    ports: ['127.0.0.1:${MAGRIT_MAIL_LOCAL_PORT:-18025}:8025']
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    volumes: [mail-data:/data]

volumes:
  postgres-data:
  s3-data:
  mail-data:

networks:
  preprod:
    ipam:
      config:
        - subnet: ${MAGRIT_DOCKER_SUBNET:-172.29.80.0/24}
