name: architecture

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'refactor/**'
  workflow_dispatch:

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # La version exacte et son integrity hash sont verrouillés par
        # package.json#packageManager. Ne pas la redéclarer ici : action-setup
        # rejette désormais les deux sources, même si leur version majeure est
        # identique.

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck modular core
        run: pnpm typecheck

      - name: Check architecture boundaries
        run: pnpm test:architecture

      # Sprint 5 — story E10.0 (CA2, CA12). Les deux etapes sont BLOQUANTES.
      #
      # gen:api:check echoue si src/platform/api/generated/ a derive de
      # openapi/magrit-core.v1.yaml : les types sont un artefact du contrat, pas
      # une source parallele qu on pourrait retoucher a la main.
      - name: Check generated API types match the OpenAPI contract
        run: pnpm gen:api:check

      # test:contract valide le contrat lui-meme (nommage, securite, enveloppe,
      # pagination, idempotence, ETag, bus d evenements) ET les payloads
      # reellement produits par le code contre ce contrat.
      - name: Run API contract tests
        run: pnpm test:contract
