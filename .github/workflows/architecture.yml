name: architecture

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'refactor/**'
  workflow_dispatch:

jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # La version exacte et son integrity hash sont verrouillés par
        # package.json#packageManager. Ne pas la redéclarer ici : action-setup
        # rejette désormais les deux sources, même si leur version majeure est
        # identique.

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck modular core
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Run complete Vitest suite
        run: pnpm test

      - name: Check architecture boundaries
        run: pnpm test:architecture

      # Sprint 5 — story E10.0 (CA2, CA12). Les deux etapes sont BLOQUANTES.
      #
      # gen:api:check echoue si src/platform/api/generated/ a derive de
      # openapi/magrit-core.v1.yaml : les types sont un artefact du contrat, pas
      # une source parallele qu on pourrait retoucher a la main.
      - name: Check generated API types match the OpenAPI contract
        run: pnpm gen:api:check

      # test:contract valide le contrat lui-meme (nommage, securite, enveloppe,
      # pagination, idempotence, ETag, bus d evenements) ET les payloads
      # reellement produits par le code contre ce contrat.
      - name: Run API contract tests
        run: pnpm test:contract

      # Sprint 5 — E10.18d, treizieme entree du bandeau §8.24, point (ii) :
      # « un test de non-regression EN CI » etait une intention, pas une
      # propriete — ce workflow ne lancait AUCUN test de `tests/modules/`,
      # donc ni le fichier de reference XLSX ni le test de volume n y avaient
      # JAMAIS tourne. Etape BLOQUANTE, CIBLEE (n importe pas les 3 echecs
      # preexistants de `tests/storage/`, sans rapport). Ni Docker ni
      # Supabase local ne sont requis : ces tests dynamiques importent le
      # renderer directement (voir `xlsx-renderer.volume.test.ts`,
      # `xlsx-renderer.reference.test.ts`). Le runner GitHub Actions est en
      # `TZ=UTC` par defaut — c est exactement la condition que le test de
      # date force en interne (`process.env.TZ = 'America/Los_Angeles'`)
      # doit tenir SANS configuration supplementaire ici (verifie par
      # execution reelle en local sous `TZ=UTC`, voir le rapport de fin de
      # story).
      - name: Run XLSX/CSV order export tests (order-exports module)
        run: pnpm exec vitest run tests/modules/order-exports

  portable-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL and S3
        run: docker compose -f compose.dev.yml up -d --wait postgres s3

      - name: Apply portable migrations and initialize buckets
        run: |
          pnpm db:migrate
          node scripts/infra/ensure-s3-buckets.mjs

      - name: Run PostgreSQL and S3 integration tests
        run: pnpm test:postgres:integration

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail 200 postgres s3

      - name: Stop portable services
        if: always()
        run: docker compose -f compose.dev.yml down --volumes
