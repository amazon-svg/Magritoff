name: a11y

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  portable-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start portable application
        run: pnpm dev:local > /tmp/magrit-a11y-runtime.log 2>&1 &
      - name: Wait for API and interface
        run: |
          for attempt in {1..60}; do
            if curl -fs http://127.0.0.1:8787/api/v1/readiness > /dev/null && curl -fs http://localhost:5176/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/magrit-a11y-runtime.log
          exit 1
      - name: Test login, workspace, HopeStudio, storefront and accessibility
        env:
          E2E_BASE_URL: http://localhost:5176
        run: pnpm exec playwright test tests/e2e/_setup.spec.ts tests/e2e/a11y-dynamic.spec.ts tests/e2e/atelier-no-cart-button.spec.ts tests/e2e/hopstudio-project-import.spec.ts tests/e2e/storefront-purchase-flow.spec.ts tests/e2e/backoffice-shops-ux.spec.ts tests/e2e/shop-customer-management.spec.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-browser-evidence
          path: |
            playwright-report/
            test-results/
            /tmp/magrit-a11y-runtime.log
          retention-days: 30
      - name: Stop local infrastructure
        if: always()
        run: pnpm infra:dev:down
