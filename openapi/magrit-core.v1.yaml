# ============================================================================
# Magrit Core API v1 — module Gestion commerciale (Epic E10)
# ----------------------------------------------------------------------------
# SOURCE DE VERITE UNIQUE de tout endpoint /api/v1 du module Gestion
# commerciale. Aucun endpoint E10 n est implemente sans etre decrit ici avant
# (E10.0 CA1). Les types TypeScript en sont derives par `pnpm gen:api` — aucun
# DTO n est ecrit a la main des deux cotes (CA2).
#
# L ancien fichier docs/architecture/api/openapi.yaml reste en vigueur pour les
# endpoints qu il decrit deja (/health, /diagnostics/*). Il est DEPRECIE pour
# tout nouvel endpoint E10.
#
# Regle de versionnement (CA13) : v1 est ADDITIVE uniquement. Ajouter un champ
# optionnel, une operation, une valeur d enumeration : autorise. Retirer ou
# renommer un champ, restreindre un type, changer un statut de reponse :
# interdit — cela exige /api/v2.
#
# Conventions detaillees : docs/api/CONVENTIONS.md
# ============================================================================
openapi: 3.1.0

info:
  title: Magrit Core API — Gestion commerciale
  version: 1.0.0
  summary: Facade metier stable du module Gestion commerciale de Magrit.
  description: >-
    Contrat API-first du module Gestion commerciale (Epic E10). Il est produit
    avant le code et sert de reference d integration aux modules tiers (Studio,
    Clariprint Data).


    Principes opposables :

    - Toutes les routes sont prefixees `/api/v1/`, les ressources sont au
      pluriel en kebab-case (`/price-rules`, `/customers`).

    - Le tenant est TOUJOURS resolu depuis le jeton d authentification. Il n est
      jamais un parametre de chemin ni de requete.

    - Reponse de succes uniforme : `{ "data": ..., "meta": {...} }`.

    - Reponse d erreur : RFC 7807 `application/problem+json` avec un champ
      `code` metier stable de la forme `domaine.raison`.

    - Pagination par curseur : `?page[size]=50&page[cursor]=...`, curseur
      suivant dans `meta.next_cursor`.

    - Tout POST creant une ressource metier honore `Idempotency-Key`.

    - Tout PATCH est protege par `ETag` / `If-Match` ; conflit -> 409 avec l
      etat courant dans `current_state`.
  contact:
    name: AGE Developpement — equipe Magrit
  license:
    name: Proprietaire
    identifier: LicenseRef-AGE-Proprietary

servers:
  - url: /api/v1
    description: Facade API v1 montee par l application Magrit.

security:
  - bearerAuth: []

tags:
  - name: gestion-commerciale
    description: Ressources metier du module Gestion commerciale (Epic E10).

# ----------------------------------------------------------------------------
# story E10.4 — Entite Client (personne morale ou physique) et interlocuteurs.
# Table pivot de l Epic E10 : projects, quotes, orders, price_rules pointeront
# tous vers `customers`.
#
# Ecriture (creation, modification, interlocuteurs, verification SIRET)
# reservee aux jetons utilisateur (`authentication: user` cote code) : cette
# story n ouvre aucun scope d ecriture aux cles de service. Lecture ouverte a
# Studio via le scope `customers:read` (deja declare par E10.0 dans
# x-magrit-scopes).
# ----------------------------------------------------------------------------
paths:
  /customers:
    # Selection de l espace de travail : commune a toutes les operations de ce
    # chemin. Declaree au niveau du chemin plutot que repetee sur chaque
    # operation — un oubli sur une seule operation rendrait l en-tete invisible
    # pour un client pilote par le contrat.
    parameters:
      - $ref: '#/components/parameters/MagritTenant'
    get:
      operationId: listCustomers
      summary: Liste les clients du tenant courant.
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
        - serviceKey: []
      x-required-scopes: [customers:read]
      parameters:
        - name: q
          in: query
          required: false
          description: >-
            Recherche plein texte sur la raison sociale, le nom ou le prenom
            du client.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: type
          in: query
          required: false
          description: Filtre sur le type de client.
          schema:
            $ref: '#/components/schemas/CustomerType'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Page de clients du tenant.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    post:
      operationId: createCustomer
      summary: Cree un client (personne morale ou physique).
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Cle d idempotence de la creation (CA8, voir
            components/parameters/IdempotencyKey pour la description
            complete).
          schema:
            type: string
            minLength: 8
            maxLength: 255
            pattern: '^[A-Za-z0-9_.:-]{8,255}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerCommand'
      responses:
        '201':
          description: Client cree.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: >-
            SIRET au format invalide (14 chiffres, cle de Luhn), ou champ
            requis absent pour le type de client (raison sociale et SIRET
            pour `company`, prenom et nom pour `individual`). Code
            `api.validation_failed`, detail champ par champ dans `errors`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /customers/{customerId}:
    # Selection de l espace de travail : commune a toutes les operations de ce
    # chemin. Declaree au niveau du chemin plutot que repetee sur chaque
    # operation — un oubli sur une seule operation rendrait l en-tete invisible
    # pour un client pilote par le contrat.
    parameters:
      - $ref: '#/components/parameters/MagritTenant'
    get:
      operationId: getCustomer
      summary: >-
        Recupere la fiche detaillee d un client : coordonnees, interlocuteurs,
        et points d extension projets/devis/commandes (vides tant que
        E10.1/E10.3/E10.12 ne sont pas livrees).
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
        - serviceKey: []
      x-required-scopes: [customers:read]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: >-
            Fiche client detaillee. L `ETag` porte sur le sous-ensemble
            `Customer` de cette fiche (hors interlocuteurs et points
            d extension) : c est la meme base de calcul que celle verifiee
            par `updateCustomer`, condition necessaire pour qu un `If-Match`
            lu ici soit accepte par le `PATCH` (CA9).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CustomerDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateCustomer
      summary: >-
        Modifie un client existant, ou le desactive (`is_active: false`). Le
        type (`company`/`individual`) n est pas modifiable par cette
        operation.
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - name: If-Match
          in: header
          required: true
          description: >-
            Precondition de concurrence optimiste (CA9, voir
            components/parameters/IfMatch pour la description complete).
          schema:
            type: string
            minLength: 3
            maxLength: 255
            pattern: '^(W/)?"[^"]+"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerCommand'
      responses:
        '200':
          description: Client modifie.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /customers/{customerId}/contacts:
    # Selection de l espace de travail : commune a toutes les operations de ce
    # chemin. Declaree au niveau du chemin plutot que repetee sur chaque
    # operation — un oubli sur une seule operation rendrait l en-tete invisible
    # pour un client pilote par le contrat.
    parameters:
      - $ref: '#/components/parameters/MagritTenant'
    get:
      operationId: listCustomerContacts
      summary: Liste les interlocuteurs d un client.
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
        - serviceKey: []
      x-required-scopes: [customers:read]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Interlocuteurs du client.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomerContact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createCustomerContact
      summary: >-
        Ajoute un interlocuteur a un client. Donnee de gestion pure : ne cree
        aucun compte utilisateur, n envoie aucune invitation.
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Cle d idempotence de la creation (CA8, voir
            components/parameters/IdempotencyKey pour la description
            complete).
          schema:
            type: string
            minLength: 8
            maxLength: 255
            pattern: '^[A-Za-z0-9_.:-]{8,255}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerContactCommand'
      responses:
        '201':
          description: >-
            Interlocuteur cree. Si `is_primary: true`, l ancien interlocuteur
            principal (s il existe) perd automatiquement ce statut.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CustomerContact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /customers/{customerId}/contacts/{contactId}:
    # Selection de l espace de travail : commune a toutes les operations de ce
    # chemin. Declaree au niveau du chemin plutot que repetee sur chaque
    # operation — un oubli sur une seule operation rendrait l en-tete invisible
    # pour un client pilote par le contrat.
    parameters:
      - $ref: '#/components/parameters/MagritTenant'
    get:
      operationId: getCustomerContact
      summary: >-
        Recupere un interlocuteur et son `ETag` courant — necessaire pour
        enchainer un `PATCH` protege par `If-Match` (CA9). `listCustomerContacts`
        n emet aucun `ETag` : une collection n a pas de version unique
        opposable a un `If-Match` portant sur UN de ses elements ; c est cet
        endpoint, pas la liste, qui fait foi pour la concurrence optimiste
        d un interlocuteur donne.
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
        - serviceKey: []
      x-required-scopes: [customers:read]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - name: contactId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: Interlocuteur.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CustomerContact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateCustomerContact
      summary: >-
        Modifie un interlocuteur. Passer `is_primary: true` bascule
        automatiquement l ancien interlocuteur principal a `false`.
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - name: contactId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: If-Match
          in: header
          required: true
          description: >-
            Precondition de concurrence optimiste (CA9, voir
            components/parameters/IfMatch pour la description complete).
          schema:
            type: string
            minLength: 3
            maxLength: 255
            pattern: '^(W/)?"[^"]+"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerContactCommand'
      responses:
        '200':
          description: Interlocuteur modifie.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CustomerContact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /customers/{customerId}/contacts/{contactId}/shop-access:
    # story E10.5 — dissociation comptes Magrit / comptes clients boutique.
    # Ouvrir un acces boutique a un interlocuteur est une action EXPLICITE et
    # DISTINCTE de sa creation (CA2, CA3) : aucune route de conversion de type
    # de compte n existe, dans un sens ou l autre — l exclusivite entre
    # `tenant_members` et `shop_customer_accounts` est posee en base (CA5).
    parameters:
      - $ref: '#/components/parameters/MagritTenant'
    post:
      operationId: openCustomerContactShopAccess
      summary: >-
        Ouvre un acces boutique explicite pour cet interlocuteur : cree (ou
        relie) un compte `shop_customer_accounts` lie a `customer_contact_id`
        et emet son lien d activation. Un interlocuteur ne porte qu un seul
        acces par boutique (CA3).
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - name: contactId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Cle d idempotence de la creation (CA8, voir
            components/parameters/IdempotencyKey pour la description
            complete).
          schema:
            type: string
            minLength: 8
            maxLength: 255
            pattern: '^[A-Za-z0-9_.:-]{8,255}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenCustomerContactShopAccessCommand'
      responses:
        '201':
          description: Acces boutique ouvert.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CustomerContactShopAccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Un acces est deja ouvert pour cet interlocuteur dans cette
            boutique (`customer_contact.shop_access_already_open`), ou l
            email de l interlocuteur est deja utilise par le compte boutique
            d un AUTRE interlocuteur dans cette boutique
            (`customer_contact.shop_access_email_conflict`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      operationId: revokeCustomerContactShopAccess
      summary: >-
        Revoque l acces boutique de cet interlocuteur dans la boutique
        indiquee : delie l interlocuteur du compte et suspend ce dernier.
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - name: contactId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeCustomerContactShopAccessCommand'
      responses:
        '200':
          description: Acces revoque.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [revoked]
                        properties:
                          revoked:
                            type: boolean
                            enum: [true]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            Aucun acces boutique ouvert pour cet interlocuteur dans cette
            boutique (`customer_contact.shop_access_not_open`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /customers/{customerId}/siret-verifications:
    # Selection de l espace de travail : commune a toutes les operations de ce
    # chemin. Declaree au niveau du chemin plutot que repetee sur chaque
    # operation — un oubli sur une seule operation rendrait l en-tete invisible
    # pour un client pilote par le contrat.
    parameters:
      - $ref: '#/components/parameters/MagritTenant'
    post:
      operationId: verifyCustomerSiret
      summary: >-
        Verifie le SIRET d un client aupres de l INSEE. BOUCHON (mock) tant
        que le compte INSEE reel n est pas cree — meme principe que le mock
        SIREN de E6.1 (`src/modules/tenants/ui/helpers/sirenValidator.ts`) :
        format + cle de Luhn controles reellement, reponse INSEE simulee de
        facon credible, `mocked: true` explicite dans la reponse.
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Cle d idempotence de la creation (CA8, voir
            components/parameters/IdempotencyKey pour la description
            complete).
          schema:
            type: string
            minLength: 8
            maxLength: 255
            pattern: '^[A-Za-z0-9_.:-]{8,255}$'
      responses:
        '201':
          description: Resultat de la verification, applique au client.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SiretVerificationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: >-
            Le client n est pas de type `company`, ou ne porte aucun SIRET
            (`customer.not_a_company`, `customer.siret_missing`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

# ----------------------------------------------------------------------------
# story E10.1 — Espace Projets : conteneur de travail commercial, en
# remplacement du panier sur les surfaces internes Magrit (atelier, resultats
# de chiffrage). Point d entree de la creation de devis (E10.3, story
# suivante) ; Studio consomme cette API des sa publication (WM du 01/09).
#
# Ecriture (creation, renommage, changement de client, archivage, ajout/retrait
# d elements) reservee aux jetons utilisateur, comme E10.4. Lecture ouverte a
# Studio via le scope `projects:read`.
# ----------------------------------------------------------------------------
  /projects:
    # Selection de l espace de travail : commune a toutes les operations de ce
    # chemin. Declaree au niveau du chemin plutot que repetee sur chaque
    # operation — un oubli sur une seule operation rendrait l en-tete invisible
    # pour un client pilote par le contrat.
    parameters:
      - $ref: '#/components/parameters/MagritTenant'
    get:
      operationId: listProjects
      summary: >-
        Liste les projets du tenant courant, tries par date de derniere
        modification decroissante (CA2).
      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
        - serviceKey: []
      x-required-scopes: [projects:read]
      parameters:
        - name: q
          in: query
          required: false
          description: Recherche plein texte sur le nom du projet.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: customer_id
          in: query
          required: false
          description: Filtre sur le client du projet.
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: tag_id
          in: query
          required: false
          description: >-
            Filtre sur un seul tag de projet (E10.2). Conserve pour
            compatibilite avec les integrations qui ciblent un tag unique
            (Studio) ; equivalent a `tag_ids` a un seul element. Combinable
            avec `tag_ids` (union, dedoublonnee).
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: tag_ids
          in: query
          required: false
          description: >-
            Filtre multi-tags en ET logique (CA4, E10.2) : seuls les projets
            portant TOUS les tags listes sont rendus. Liste d UUID separes
            par des virgules, ex. `tag_ids=<uuid1>,<uuid2>`. Un identifiant
            malforme rend 400.
          schema:
            type: string
            minLength: 36
            maxLength: 2000
        - name: status
          in: query
