                      data:
                        $ref: '#/components/schemas/ProjectItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /projects/{projectId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/MagritTenant'
    delete:
      operationId: removeProjectItem
      summary: >-
        Retire un element de chiffrage du projet : retrait du lien
        uniquement, jamais suppression de l historique de chiffrage si
        celui-ci existe ailleurs (E10.3+).
