      tags: [gestion-commerciale]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: If-Match
          in: header
          required: true
          description: >-
            Precondition de concurrence optimiste sur le PROJET (CA9, meme
            garantie qu un PATCH — voir components/parameters/IfMatch).
            E10.2 etend cette garde a ce PUT : deux commerciaux qui retaguent
            le meme projet en parallele ne doivent pas s ecraser en silence.
          schema:
            type: string
            minLength: 3
            maxLength: 255
            pattern: '^(W/)?"[^"]+"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceProjectTagsCommand'
      responses:
        '200':
          description: Tags du projet remplaces.
