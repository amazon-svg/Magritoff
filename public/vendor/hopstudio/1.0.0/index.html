<!-- 💬 Chatbox Widget IA -->
<style>
#chat-widget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 620px;
  max-height: 600px;
  background: white;
  border: 1px solid #ccc;
  box-shadow: 0 0 12px rgba(0,0,0,0.2);
  border-radius: 8px;
  font-family: sans-serif;
  display: flex;
  flex-direction: column;
  z-index: 9999;
}

#chat-header {
  background: #333;
  color: #fff;
  padding: 8px 12px;
  cursor: move;
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
  border-top-left-radius: 8px;
  border-top-right-radius: 8px;
}

#chat-header button {
  background: none;
  color: #fff;
  border: none;
  font-size: 14px;
  cursor: pointer;
}

#chat-body {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

#chat-input {
  display: flex;
  border-top: 1px solid #ccc;
}

#chat-input input {
  flex: 1;
  border: none;
  padding: 8px;
  font-size: 14px;
}

#chat-input input:focus {
  outline: none;
}

.chat-msg.user {
  text-align: right;
  color: #000;
}

.chat-msg.ai {
  text-align: left;
  color: #444;
  background: #f1f1f1;
  padding: 6px 10px;
  border-radius: 6px;
  max-width: 90%;
}
</style>

<div id="chat-widget">
  <div id="chat-header">
    <span>Copilote IA</span>
    <button id="chat-toggle">−</button>
  </div>

  <div id="chat-input">
    <input type="text" placeholder="Écrivez ici..." id="chat-text" />
  </div>

(() => {
  const chat = document.getElementById("chat-widget");
  const body = document.getElementById("chat-body");
  const input = document.getElementById("chat-text");
  const toggle = document.getElementById("chat-toggle");
  var ragContext = {};

  // 🧠 Dialogue simple (remplace par ton appel API GPT)

  async function sendMessage(text) {
    appendMessage("user", text);
    input.value = "";
    appendMessage("ai", "Je réfléchis...");
    
    const bodydata = {
      	'action': 'CallAI',
      	'id' : 'hopes-chat-to-product-UI-full-lib',
      	'parameters_value' : JSON.stringify({
      		'prompt': text,
      		'ragContext' : ragContext })
    };
    
    const response = await fetch("/json.wcl", {
      method: "POST",
//      headers: { "Content-Type": "application/json" },
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body : new URLSearchParams(bodydata).toString()
//      body: JSON.stringify(bodydata)
    });

    const data = await response.json();
    
    ragContext = data.response.ragContext ?? ragContext;
    
    body.lastChild.remove(); // remove "Je réfléchis..."

   	const ui_event = data.response.ui_event;
    const ui_event2 = data.response.ui_event ?? {};
    const ui_event_name = ui_event2.event ?? null;
    const ui_event_lib_id = ui_event2.ID ?? null;
    const ui_event_config = ui_event2.configuration ?? null;
    const ui_app = window.sugarcrepeHL.allInstances[0] ?? null;

    if (typeof ui_event_name === "string" && typeof ui_event_lib_id === "string" && !!ui_event_config && !!ui_app) {
    	chat.addEventListener(ui_event_name, () => {
    		ui_app.processEvent(ui_event_name,{ id : ui_event_lib_id, conf : ui_event_config});
    	});
    }

   	const CTAs = ui_event ? [
   		{
   			text : 'Cliquez pour aller à la configuration',
   			onclick : `document.getElementById('chat-widget').dispatchEvent(new CustomEvent('${ui_event_name}'));`
   		}
   	] : [];

    appendMessage("ai", data.response.ai_message || "[Pas de réponse]", CTAs);

  }

	function txtToHtmlPlus(text) {
	  const escaped = text
	    .replace(/&/g, "&amp;")
	    .replace(/</g, "&lt;")
	    .replace(/>/g, "&gt;");

	  const paragraphs = escaped.split(/\n{2,}/); // 2+ sauts = nouveau paragraphe
	  return paragraphs.map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("\n");
	}

  function txtToHtml(text) {
	  try {
	    text = JSON.parse(`"${text}"`); // force le décodage \n, \t, etc.
	  } catch (e) {
	    // ignore si ce n'est pas du JSON-encodé
	  }

	  return text
	    .replace(/&/g, "&amp;")    // sécurisation HTML
	    .replace(/</g, "&lt;")
	    .replace(/>/g, "&gt;")
	    .replace(/\n/g, "<br>");
	}

	function renderModelResponse(text) {
	  try {
	    text = JSON.parse(`"${text}"`); // force le décodage \n, \t, etc.
	  } catch (e) {
	    // ignore si ce n'est pas du JSON-encodé
	  }

	  // Décode éventuels `\n`
	  text = text.replace(/\\n/g, '\n');

	  // Encode HTML et convertit \n en <br>
	  text = text
	    .replace(/&/g, "&amp;")
	    .replace(/</g, "&lt;")
	    .replace(/>/g, "&gt;")
	    .replace(/\n/g, "<br>");


		// Remplace les noms de modèles entre ** ** par des liens cliquables
		text = text.replace(/\*\*([^:*]+:)\*\*/g, (match, proposition) => {
		  return `<a href="#" class="proposition-uncomplete" data-proposition="${proposition}"><strong>${proposition}</strong></a>`;
		});
		text = text.replace(/\*\*([a-z,A-Z,~]+[^*]+)\*\*/g, (match, proposition) => {
		  return `<a href="#" class="proposition-complete" data-proposition="${proposition}"><strong>${proposition}</strong></a>`;
		});

	  return text;
	}


  function appendMessage(role, text, CTAs = []) {
    const div = document.createElement("div");
    div.className = "chat-msg " + role;
//    div.innerText = txtToHtml(text);
    div.innerHTML = renderModelResponse(text);
    CTAs.forEach(CTA => {
    	div.innerHTML += `<br><a href="#" onclick="${CTA.onclick}">${CTA.text}</a>`;
    });

    body.appendChild(div);
    body.scrollTop = body.scrollHeight;

    // Ajout d’un gestionnaire de clic
	  div.querySelectorAll('.proposition-complete').forEach(link => {
	    link.addEventListener('click', function(e) {
	      e.preventDefault();
	      const proposition = this.dataset.proposition;
	      if (proposition.match(/[a-z;A-Z,0-9]+~[a-z,A-Z,0-9]+/))
	      	sendMessage(`OK : ${proposition}`);
	      else sendMessage(`${proposition}`);

	      // Tu peux ici déclencher d'autres actions comme charger le modèle
	      // ex: loadLibrary(model);
	    });
	  });
	  div.querySelectorAll('.proposition-uncomplete').forEach(link => {
	    link.addEventListener('click', function(e) {
	      e.preventDefault();
	      const proposition = this.dataset.proposition;
	      input.value = `${proposition}`;

	      // Tu peux ici déclencher d'autres actions comme charger le modèle
	      // ex: loadLibrary(model);
	    });
	  });
  }

  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter" && input.value.trim()) {
      sendMessage(input.value.trim());
    }
  });

  // 🧲 Réduction / extension
  toggle.addEventListener("click", () => {
    const isOpen = body.style.display !== "none";
    body.style.display = isOpen ? "none" : "flex";
    input.parentElement.style.display = isOpen ? "none" : "flex";
    toggle.textContent = isOpen ? "+" : "−";
  });

  // 🎣 Drag and drop
  let isDragging = false, offsetX = 0, offsetY = 0;
  const header = document.getElementById("chat-header");
  header.addEventListener("mousedown", (e) => {
    isDragging = true;
    offsetX = e.clientX - chat.offsetLeft;
    offsetY = e.clientY - chat.offsetTop;
    document.body.style.userSelect = "none";
  });
  document.addEventListener("mouseup", () => {
    isDragging = false;
    document.body.style.userSelect = "";
  });
  document.addEventListener("mousemove", (e) => {
    if (isDragging) {
      chat.style.left = e.clientX - offsetX + "px";
      chat.style.top = e.clientY - offsetY + "px";
      chat.style.right = "auto";
      chat.style.bottom = "auto";
      chat.style.position = "fixed";
    }
  });
})();
</script>
