name: magritoff-dev

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${MAGRIT_DEV_POSTGRES_DB:-magrit}
      POSTGRES_USER: ${MAGRIT_DEV_POSTGRES_USER:-magrit}
      POSTGRES_PASSWORD: ${MAGRIT_DEV_POSTGRES_PASSWORD:-magrit-local-only}
    ports:
      - "127.0.0.1:${MAGRIT_DEV_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${MAGRIT_DEV_S3_ACCESS_KEY_ID:-magrit-local}
      AWS_SECRET_ACCESS_KEY: ${MAGRIT_DEV_S3_SECRET_ACCESS_KEY:-magrit-local-secret}
    ports:
      - "127.0.0.1:${MAGRIT_DEV_S3_PORT:-58333}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:9333/cluster/status
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mail:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAGRIT_DEV_MAIL_UI_PORT:-58025}:8025"
      - "127.0.0.1:${MAGRIT_DEV_MAIL_SMTP_PORT:-51025}:1025"
    volumes:
      - mail-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
  mail-data:
