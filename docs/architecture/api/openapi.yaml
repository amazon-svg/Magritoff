openapi: 3.1.0
info:
  title: API Magrit
  version: 1.0.0
  description: >-
    Façade métier stable de Magrit. Les fournisseurs de données et runtimes
    de déploiement ne font pas partie de ce contrat.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getApiHealth
      summary: Vérifier la disponibilité de la façade API
      security: []
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /assistant/chat:
    post:
      operationId: chatWithProductAssistant
      summary: Décrire et configurer des produits avec l’assistant métier
      description: >-
        Façade stable du chat Magrit. Le fournisseur HopeStudio et son runtime
        de déploiement restent des détails serveur. Le flux peut être servi par
        un service autonome et ne dépend pas d une Edge Function Supabase.
        Le serveur déduit userId du jeton authentifié et valide tenantId dans
        les appartenances Magrit avant de transmettre cette identité stable à
        HopeStudio. HopeStudio reste responsable de sa propre sécurité, de
        l isolation de ses données et de la récupération de l historique métier.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantChatCommand' }
      responses:
        '200':
          description: Réponse normalisée ou flux SSE terminé par un événement done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HopeStudioChatResult' }
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '422': { description: Requête assistant invalide }
        '502': { description: HopeStudio indisponible ou réponse non conforme }
  /diagnostics/ai:
    get:
      operationId: testAiProvider
      summary: Tester le fournisseur IA actif sans exposer ses secrets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: État normalisé de la connexion au fournisseur IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderDiagnostic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /diagnostics/clariprint:
    get:
      operationId: testClariprint
      summary: Tester CheckAuth Clariprint sans exposer ses identifiants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: État normalisé de la connexion Clariprint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClariprintDiagnostic'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /tenants/{tenantId}/quotes/drafts:
    post:
      operationId: createQuoteDraft
      summary: Créer un brouillon de devis rapide pour l utilisateur courant
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuoteDraft' }
      responses:
        '201':
          description: Brouillon créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteDraftCreated' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { description: Création interdite dans ce tenant }
        '422': { description: Données du brouillon invalides }
  /tenants/{tenantId}/quotes:
    get:
      operationId: listQuotes
      summary: Lister les devis du tenant selon le scope autorisé
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [mine, all], default: mine } }
      responses:
        '200': { description: Devis accessibles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/QuoteRecord' } } } } }
        '403': { description: Scope tous les devis interdit }
    post:
      operationId: createEditableQuote
      summary: Créer un devis éditable avec ses lignes
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEditableQuote' } } } }
      responses:
        '201': { description: Devis créé, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteDraftCreated' } } } }
  /tenants/{tenantId}/quotes/{quoteId}:
    get:
      operationId: getQuote
      summary: Charger un devis et ses lignes
      security: [{ bearerAuth: [] }]
      parameters: &quotePathParameters
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { name: quoteId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Devis complet, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteWithLines' } } } }
        '404': { description: Devis introuvable }
    put:
      operationId: saveQuote
      summary: Remplacer les lignes et mettre à jour le devis
      security: [{ bearerAuth: [] }]
      parameters: *quotePathParameters
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveQuote' } } } }
      responses: { '200': { description: Devis mis à jour } }
    patch:
      operationId: setQuoteStatus
      summary: Modifier le statut d un devis
      security: [{ bearerAuth: [] }]
      parameters: *quotePathParameters
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [status], properties: { status: { type: string } } } } } }
      responses: { '200': { description: Statut mis à jour } }
    delete:
      operationId: deleteQuote
      summary: Supprimer un devis et ses lignes
      security: [{ bearerAuth: [] }]
      parameters: *quotePathParameters
      responses: { '200': { description: Devis supprimé } }
  /tenants/{tenantId}/quotes/{quoteId}/duplicate:
    post:
      operationId: duplicateQuote
      summary: Dupliquer un devis pour l utilisateur courant
      security: [{ bearerAuth: [] }]
      parameters: *quotePathParameters
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [reference], properties: { reference: { type: string } } } } } }
      responses: { '201': { description: Copie créée, content: { application/json: { schema: { $ref: '#/components/schemas/QuoteDraftCreated' } } } } }
  /session:
    get:
      operationId: getSessionBootstrap
      summary: Charger le bootstrap utilisateur, tenants et préférences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session applicative agrégée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBootstrap'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /session/invitations/accept:
    post:
      operationId: acceptTenantInvitation
      summary: Accepter une invitation tenant pour l utilisateur authentifié
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptTenantInvitation' }
      responses:
        '200':
          description: Invitation acceptée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantMutationCreated' }
        '409': { description: Invitation destinée à un autre email }
        '422': { description: Invitation invalide ou expirée }
  /tenants:
    post:
      operationId: createRootTenant
      summary: Créer un espace racine et affecter son propriétaire
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRootTenant' }
      responses:
        '201':
          description: Espace créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantMutationCreated' }
        '409': { description: Slug déjà utilisé }
        '422': { description: Données de création invalides }
  /session/preferences:
    patch:
      operationId: updateSessionPreferences
      summary: Modifier les préférences utilisateur
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferences'
      responses:
        '200':
          description: Préférences réconciliées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /session/current-tenant:
    put:
      operationId: updateCurrentTenant
      summary: Mémoriser le dernier tenant sélectionné
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId]
              properties:
                tenantId:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Préférences réconciliées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Tenant hors du périmètre accessible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /tenant-slugs/{slug}:
    get:
      operationId: resolveTenantSlug
      summary: Résoudre un slug tenant courant ou archivé
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$', maxLength: 160 } }
      responses:
        '200':
          description: Slug actuel, ou null si le slug est inconnu ou expiré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSlugResolution' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '422': { description: Slug invalide }
  /tenants/{tenantId}/orders:
    get:
      operationId: listTenantOrders
      summary: Lister les commandes agrégées d un tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - name: shopId
          in: query
          schema: { type: array, items: { type: string } }
      responses:
        '200':
          description: Commandes v1.1 et historiques normalisées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersList' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /shops/{shopId}/orders:
    get:
      operationId: listPortalOrders
      summary: Charger les compteurs et vues workflow du portail
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: shopId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Datasets du portail agrégés
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalOrdersResponse' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /shops/{shopId}/buyer-registration:
    post:
      operationId: registerShopBuyer
      summary: Rattacher l utilisateur courant à une boutique en inscription libre
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: shopId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rattachement créé ou déjà présent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopBuyerRegistrationResult' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { description: Boutique privée, inactive ou rattachement interdit }
        '404': { description: Boutique introuvable }
  /orders:
    post:
      operationId: createOrder
      summary: Créer atomiquement une commande et ses lignes
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderCommand' }
      responses:
        '201':
          description: Commande créée ou résultat précédent rejoué
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResult' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: Création interdite pour cet acteur
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
        '422':
          description: Panier invalide
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
  /orders/{orderId}/audit:
    get:
      operationId: getOrderAuditTrail
      summary: Charger l historique métier d une commande
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Événements de statut et de rôles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAuditTrail' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /orders/{orderId}/draft:
    get:
      operationId: getDraftOrder
      summary: Charger les lignes éditables d une commande brouillon
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Brouillon et lignes de son auteur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftOrder' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404':
          description: Commande absente ou hors périmètre de l auteur
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
    put:
      operationId: updateDraftOrder
      summary: Mettre à jour atomiquement les lignes et le total d un brouillon
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDraftOrderCommand' }
      responses:
        '200':
          description: Brouillon mis à jour ou résultat précédent rejoué
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateDraftOrderResult' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: Acteur non autorisé
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
        '409':
          description: La commande n est plus en brouillon
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
  /orders/{orderId}/transitions:
    post:
      operationId: transitionOrder
      summary: Exécuter une transition de statut atomique et idempotente
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionOrderCommand' }
      responses:
        '200':
          description: Transition exécutée ou résultat précédent rejoué
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionOrderResult' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: Acteur non autorisé pour cette transition
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
        '409':
          description: Transition absente de la matrice ou statut déjà modifié
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
  /orders/{orderId}/roles:
    get:
      operationId: getOrderRoles
      summary: Charger les rôles et capacités de l acteur sur une commande
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Rôles actifs, capacités cumulées et indicateur auteur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderRolesResponse' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404':
          description: Commande hors périmètre
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
  /tenants/{tenantId}:
    patch:
      operationId: updateTenantSettings
      summary: Modifier le nom et, pour un super-administrateur, le slug d’un espace
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantSettings' }
      responses:
        '200':
          description: Espace modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantMutationResult' }
        '403': { description: Modification interdite }
        '409': { description: Slug déjà utilisé }
  /tenants/{tenantId}/integrations/hopstudio:
    get:
      operationId: getHopeStudioTenantSettings
      summary: Charger la configuration Clariprint Studio expurgée du tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Configuration sans aucun secret lisible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HopeStudioTenantSettings' }
        '403': { description: Administration du tenant interdite }
    put:
      operationId: updateHopeStudioTenantSettings
      summary: Enregistrer la configuration Clariprint Studio du tenant
      description: >-
        Un mot de passe absent conserve le secret existant. La valeur null le
        supprime. Le secret n est jamais retourné par cette API.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateHopeStudioTenantSettings' }
      responses:
        '200':
          description: Configuration enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HopeStudioTenantSettingsUpdated' }
        '403': { description: Administration du tenant interdite }
        '422': { description: Configuration invalide }
  /tenants/{tenantId}/integrations/hopstudio/workflow:
    post:
      operationId: callHopeStudioWorkflow
      summary: Relayer une action de l UX headless HopeStudio
      description: >-
        Endpoint utilisé exclusivement par HLUX.customApiFetch. L URL sortante,
        le tenantId et le userId sont résolus ou réécrits par le backend ; les
        secrets Clariprint ne sont jamais transmis au navigateur.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HopeStudioWorkflowCommand' }
      responses:
        '200':
          description: Réponse JSON HopeStudio transmise sans normalisation métier
          content:
            application/json:
              schema: {}
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { description: Tenant inaccessible ou contexte incohérent }
        '422': { description: Enveloppe callback invalide }
        '502': { description: HopeStudio indisponible ou réponse invalide }
  /tenants/{tenantId}/capabilities/{capability}:
    get:
      operationId: getCurrentUserCapability
      summary: Vérifier une capacité de l utilisateur courant dans un tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { name: capability, in: path, required: true, schema: { type: string, pattern: '^can_[a-z0-9_]+$', maxLength: 80 } }
      responses:
        '200':
          description: Décision calculée depuis les rôles actifs de la session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCapability' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { description: Tenant inaccessible }
        '422': { description: Capability invalide }
  /tenants/{tenantId}/subtenants:
    get:
      operationId: getSubTenantsDashboard
      summary: Lister les sous-espaces et leurs indicateurs mensuels
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sous-espaces et KPI accessibles à l administrateur du parent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubTenantsDashboard' }
        '403': { description: Lecture interdite }
    post:
      operationId: createSubTenant
      summary: Créer un sous-espace rattaché au tenant parent
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubTenant' }
      responses:
        '201':
          description: Sous-espace créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSubTenantResult' }
        '403': { description: Création interdite }
        '409': { description: Slug déjà utilisé }
  /tenants/{tenantId}/subtenants/{subTenantId}:
    delete:
      operationId: removeSubTenant
      summary: Supprimer un sous-espace direct du tenant parent
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { name: subTenantId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sous-espace supprimé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoveSubTenantResult' }
        '403': { description: Suppression interdite }
        '404': { description: Sous-espace absent du parent }
  /tenants/{tenantId}/conversations:
    get:
      operationId: listConversations
      summary: Lister l historique de conversations visible dans un tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Conversations triées de la plus récente à la plus ancienne
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        '403': { description: Tenant inaccessible }
  /tenants/{tenantId}/conversations/{conversationId}:
    put:
      operationId: saveConversation
      summary: Créer ou remplacer une conversation de l utilisateur courant
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { name: conversationId, in: path, required: true, schema: { type: string, maxLength: 200 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveConversation' }
      responses:
        '200': { description: Conversation sauvegardée }
        '403': { description: Sauvegarde interdite }
        '422': { description: Conversation invalide }
    delete:
      operationId: removeConversation
      summary: Supprimer une conversation du tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { name: conversationId, in: path, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        '200': { description: Conversation supprimée }
        '403': { description: Suppression interdite }
        '404': { description: Conversation introuvable }
  /catalog/pim/ingestion:
    get:
      operationId: getPimPendingCandidates
      summary: Compter les candidats PIM en attente
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Taille de la file PIM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PimPendingCandidates' }
        '403': { description: Administration PIM interdite }
    post:
      operationId: runPimIngestion
      summary: Simuler ou exécuter l’ingestion des candidats PIM
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunPimIngestCommand' }
      responses:
        '200':
          description: Rapport d’ingestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PimIngestReport' }
        '403': { description: Administration PIM interdite }
        '502': { description: Pipeline PIM indisponible }
  /catalog/pim/generation:
    post:
      operationId: generatePimDefinition
      summary: Générer ou valider le contenu éditorial d’une définition PIM
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeneratePimDefinitionCommand' }
      responses:
        '200':
          description: Contenu PIM généré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedPimDefinition' }
        '403': { description: Administration PIM interdite }
        '502': { description: Générateur PIM indisponible }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, apiVersion, timestamp]
      properties:
        status:
          const: ok
        apiVersion:
          const: v1
        timestamp:
          type: string
          format: date-time
    AssistantChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 20000 }
    AssistantChatCommand:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 25
          items: { $ref: '#/components/schemas/AssistantChatMessage' }
        tenantId:
          type: [string, 'null']
          maxLength: 200
          description: >-
            Tenant demandé comme contexte. Il est contrôlé côté serveur et ne
            constitue jamais à lui seul une preuve d autorisation.
        shopSlug: { type: string, minLength: 1, maxLength: 160 }
        mode: { type: string, enum: [open, strict] }
        sessionRef:
          type: [string, 'null']
          maxLength: 500
          description: >-
            Référence opaque de la session HopeStudio précédente. Elle est
            toujours réassociée côté serveur au tenant et à l utilisateur authentifiés.
        sessionDataRef:
          type: [string, 'null']
          maxLength: 500
          description: >-
            Clé DBK associée à la session HopeStudio précédente. Elle ne
            remplace jamais les tenantId et userId résolus par le serveur.
    HopeStudioProductConfig:
      type: object
      additionalProperties: false
      required: [clariprint, display, hopStudio]
      properties:
        clariprint: { type: object, additionalProperties: true }
        display: { type: object, additionalProperties: true }
        hopStudio:
          type: object
          additionalProperties: false
          required: [cardRef, dataRef]
          properties:
            cardRef: { type: [string, 'null'] }
            dataRef: { type: [string, 'null'] }
    HopeStudioChatResult:
      type: object
      additionalProperties: false
      required: [success, configs, teachingNote, demoMode, provider, sessionRef, sessionDataRef]
      properties:
        success: { const: true }
        configs:
          type: array
          items: { $ref: '#/components/schemas/HopeStudioProductConfig' }
        teachingNote: { type: [string, 'null'] }
        demoMode: { const: false }
        provider: { const: hopstudio }
        sessionRef:
          type: [string, 'null']
          description: >-
            Référence de session HopeStudio à conserver côté Magrit, toujours
            associée au couple tenantId/userId authentifié.
        sessionDataRef:
          type: [string, 'null']
          description: Clé DBK requise par HopeStudio pour poursuivre la session.
    HopeStudioTenantSettings:
      type: object
      additionalProperties: false
      required: [enabled, hopeStudioUrl, clariprintUser, clariprintPasswordConfigured, clariprintUrl]
      properties:
        enabled: { type: boolean }
        hopeStudioUrl: { type: [string, 'null'], format: uri }
        clariprintUser: { type: [string, 'null'] }
        clariprintPasswordConfigured:
          type: boolean
          description: Indique la présence du secret optionnel sans jamais le révéler.
        clariprintUrl: { type: [string, 'null'], format: uri }
    UpdateHopeStudioTenantSettings:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: { type: boolean }
        hopeStudioUrl: { type: [string, 'null'], format: uri }
        clariprintUser: { type: [string, 'null'], maxLength: 512 }
        clariprintPassword:
          type: [string, 'null']
          minLength: 1
          maxLength: 4096
          writeOnly: true
        clariprintUrl: { type: [string, 'null'], format: uri }
    HopeStudioTenantSettingsUpdated:
      type: object
      additionalProperties: false
      required: [updated]
      properties:
        updated: { const: true }
    HopeStudioWorkflowCommand:
      type: object
      additionalProperties: false
      required: [hook, event, provider, context]
      properties:
        hook: { type: string, minLength: 1, maxLength: 200 }
        event: { type: string, minLength: 1, maxLength: 200 }
        provider: { type: string, minLength: 1, maxLength: 200 }
        context:
          type: object
          required: [tenantId, userId, body]
          properties:
            tenantId: { type: string, minLength: 1, maxLength: 200 }
            userId: { type: string, minLength: 1, maxLength: 200 }
            method: { type: string, maxLength: 20 }
            headers:
              type: object
              additionalProperties: { type: string }
            body:
              type: string
              maxLength: 2000000
              description: Formulaire application/x-www-form-urlencoded émis par HopeStudio.
    AiProviderDiagnostic:
      type: object
      additionalProperties: false
      required: [provider, configured, reachable, summary, checks, testedAt]
      properties:
        provider: { type: string, minLength: 1, maxLength: 80 }
        configured: { type: boolean }
        reachable: { type: [boolean, 'null'] }
        summary: { type: string, minLength: 1, maxLength: 500 }
        responsePreview: { type: string, maxLength: 500 }
        checks:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [name, status]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              status: { type: string, enum: [ok, error, skipped] }
              details: { type: string, maxLength: 500 }
        testedAt: { type: string, format: date-time }
    ClariprintDiagnostic:
      type: object
      additionalProperties: false
      required: [service, configured, reachable, authenticated, summary, checks, testedAt]
      properties:
        service: { const: Clariprint }
        configured: { type: boolean }
        reachable: { type: [boolean, 'null'] }
        authenticated: { type: [boolean, 'null'] }
        summary: { type: string, minLength: 1, maxLength: 500 }
        httpStatus: { type: integer, minimum: 100, maximum: 599 }
        checks:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [name, status]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              status: { type: string, enum: [ok, error, skipped] }
              details: { type: string, maxLength: 500 }
        testedAt: { type: string, format: date-time }
    CreateQuoteDraft:
      type: object
      additionalProperties: false
      required: [reference, productName, productConfig, totalHt, totalTtc]
      properties:
        reference: { type: string, minLength: 1, maxLength: 120 }
        productName: { type: string, minLength: 1, maxLength: 500 }
        productConfig: {}
        totalHt: { type: number, minimum: 0 }
        totalTtc: { type: number, minimum: 0 }
    QuoteDraftCreated:
      type: object
      additionalProperties: false
