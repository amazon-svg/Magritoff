openapi: 3.1.0
info:
  title: API Magrit
  version: 1.0.0
  description: >-
    Façade métier stable de Magrit. Les fournisseurs de données et runtimes
    de déploiement ne font pas partie de ce contrat.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getApiHealth
      summary: Vérifier la disponibilité de la façade API
      security: []
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /session:
    get:
      operationId: getSessionBootstrap
      summary: Charger le bootstrap utilisateur, tenants et préférences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session applicative agrégée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBootstrap'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '500':
          $ref: '#/components/responses/InternalError'
  /session/preferences:
    patch:
      operationId: updateSessionPreferences
      summary: Modifier les préférences utilisateur
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferences'
      responses:
        '200':
          description: Préférences réconciliées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /session/current-tenant:
    put:
      operationId: updateCurrentTenant
      summary: Mémoriser le dernier tenant sélectionné
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId]
              properties:
                tenantId:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Préférences réconciliées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          description: Tenant hors du périmètre accessible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
  /tenants/{tenantId}/orders:
    get:
      operationId: listTenantOrders
      summary: Lister les commandes agrégées d un tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - name: shopId
          in: query
          schema: { type: array, items: { type: string } }
      responses:
        '200':
          description: Commandes v1.1 et historiques normalisées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersList' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /shops/{shopId}/orders:
    get:
      operationId: listPortalOrders
      summary: Charger les compteurs et vues workflow du portail
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: shopId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Datasets du portail agrégés
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalOrdersResponse' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /orders:
    post:
      operationId: createOrder
      summary: Créer atomiquement une commande et ses lignes
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderCommand' }
      responses:
        '201':
          description: Commande créée ou résultat précédent rejoué
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrderResult' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: Création interdite pour cet acteur
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
        '422':
          description: Panier invalide
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
  /orders/{orderId}/audit:
    get:
      operationId: getOrderAuditTrail
      summary: Charger l historique métier d une commande
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Événements de statut et de rôles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAuditTrail' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /orders/{orderId}/draft:
    get:
      operationId: getDraftOrder
      summary: Charger les lignes éditables d une commande brouillon
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Brouillon et lignes de son auteur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftOrder' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404':
          description: Commande absente ou hors périmètre de l auteur
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
    put:
      operationId: updateDraftOrder
      summary: Mettre à jour atomiquement les lignes et le total d un brouillon
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDraftOrderCommand' }
      responses:
        '200':
          description: Brouillon mis à jour ou résultat précédent rejoué
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateDraftOrderResult' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: Acteur non autorisé
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
        '409':
          description: La commande n est plus en brouillon
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
  /orders/{orderId}/transitions:
    post:
      operationId: transitionOrder
      summary: Exécuter une transition de statut atomique et idempotente
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionOrderCommand' }
      responses:
        '200':
          description: Transition exécutée ou résultat précédent rejoué
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransitionOrderResult' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403':
          description: Acteur non autorisé pour cette transition
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
        '409':
          description: Transition absente de la matrice ou statut déjà modifié
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
  /orders/{orderId}/roles:
    get:
      operationId: getOrderRoles
      summary: Charger les rôles et capacités de l acteur sur une commande
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Rôles actifs, capacités cumulées et indicateur auteur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderRolesResponse' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '404':
          description: Commande hors périmètre
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ApiProblem' }
  /tenants/{tenantId}:
    patch:
      operationId: updateTenantSettings
      summary: Modifier le nom et, pour un super-administrateur, le slug d’un espace
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantSettings' }
      responses:
        '200':
          description: Espace modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantMutationResult' }
        '403': { description: Modification interdite }
        '409': { description: Slug déjà utilisé }
  /tenants/{tenantId}/capabilities/{capability}:
    get:
      operationId: getCurrentUserCapability
      summary: Vérifier une capacité de l utilisateur courant dans un tenant
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { name: capability, in: path, required: true, schema: { type: string, pattern: '^can_[a-z0-9_]+$', maxLength: 80 } }
      responses:
        '200':
          description: Décision calculée depuis les rôles actifs de la session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserCapability' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { description: Tenant inaccessible }
        '422': { description: Capability invalide }
  /tenants/{tenantId}/subtenants:
    get:
      operationId: getSubTenantsDashboard
      summary: Lister les sous-espaces et leurs indicateurs mensuels
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sous-espaces et KPI accessibles à l administrateur du parent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubTenantsDashboard' }
        '403': { description: Lecture interdite }
    post:
      operationId: createSubTenant
      summary: Créer un sous-espace rattaché au tenant parent
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubTenant' }
      responses:
        '201':
          description: Sous-espace créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSubTenantResult' }
        '403': { description: Création interdite }
        '409': { description: Slug déjà utilisé }
  /tenants/{tenantId}/subtenants/{subTenantId}:
    delete:
      operationId: removeSubTenant
      summary: Supprimer un sous-espace direct du tenant parent
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenantId, in: path, required: true, schema: { type: string } }
        - { name: subTenantId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sous-espace supprimé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoveSubTenantResult' }
        '403': { description: Suppression interdite }
        '404': { description: Sous-espace absent du parent }
  /catalog/pim/ingestion:
    get:
      operationId: getPimPendingCandidates
      summary: Compter les candidats PIM en attente
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Taille de la file PIM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PimPendingCandidates' }
        '403': { description: Administration PIM interdite }
    post:
      operationId: runPimIngestion
      summary: Simuler ou exécuter l’ingestion des candidats PIM
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunPimIngestCommand' }
      responses:
        '200':
          description: Rapport d’ingestion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PimIngestReport' }
        '403': { description: Administration PIM interdite }
        '502': { description: Pipeline PIM indisponible }
  /catalog/pim/generation:
    post:
      operationId: generatePimDefinition
      summary: Générer ou valider le contenu éditorial d’une définition PIM
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeneratePimDefinitionCommand' }
      responses:
        '200':
          description: Contenu PIM généré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratedPimDefinition' }
        '403': { description: Administration PIM interdite }
        '502': { description: Générateur PIM indisponible }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, apiVersion, timestamp]
      properties:
        status:
          const: ok
        apiVersion:
          const: v1
        timestamp:
          type: string
          format: date-time
    ApiProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    MemberPermissions:
      type: object
      additionalProperties: false
      required: [can_quote, can_order, can_invite]
      properties:
        can_quote: { type: boolean }
        can_order: { type: boolean }
        can_invite: { type: boolean }
    SessionTenant:
      type: object
      required:
        - id
        - slug
        - name
        - parent_tenant_id
        - plan
        - is_system_tenant
        - settings
        - created_at
        - myRole
        - accessScope
        - allowedShopIds
        - permissions
        - inheritedFromParent
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        parent_tenant_id: { type: [string, 'null'] }
        plan: { type: string, enum: [freemium, pro, enterprise] }
        is_system_tenant: { type: boolean }
        settings: { type: object }
        created_at: { type: string, format: date-time }
        siren: { type: [string, 'null'] }
        siren_data: { type: [object, 'null'] }
        verified: { type: boolean }
        verified_at: { type: [string, 'null'], format: date-time }
        tax_regime: { type: [string, 'null'] }
        myRole: { type: string, enum: [owner, admin, member, partner] }
        accessScope: { type: string, enum: [magrit_full, shop_only] }
        allowedShopIds:
          type: array
          items: { type: string }
        permissions:
          $ref: '#/components/schemas/MemberPermissions'
        inheritedFromParent: { type: boolean }
    UserPreferences:
      type: object
      additionalProperties: false
      required:
        - theme
        - language
        - default_delivery_zone
        - notifications_email
        - plan
        - is_admin
        - last_tenant_id
      properties:
        theme: { type: string, enum: [light, dark] }
        language: { type: string, enum: [fr, en] }
        default_delivery_zone: { type: string }
        notifications_email: { type: boolean }
        plan: { type: string, enum: [freemium, pro, enterprise] }
        is_admin: { type: boolean }
        last_tenant_id: { type: [string, 'null'] }
    UpdatePreferences:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        theme: { type: string, enum: [light, dark] }
        language: { type: string, enum: [fr, en] }
        default_delivery_zone: { type: string }
        notifications_email: { type: boolean }
        plan: { type: string, enum: [freemium, pro, enterprise] }
        is_admin: { type: boolean }
    SessionBootstrap:
      type: object
      additionalProperties: false
      required: [user, tenants, isSuperAdmin, preferences]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: { type: string }
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/SessionTenant'
        isSuperAdmin: { type: boolean }
        preferences:
          $ref: '#/components/schemas/UserPreferences'
    OrderItem:
      type: object
      additionalProperties: false
      required: [name, quantity, unitPriceHt]
      properties:
        name: { type: string }
        quantity: { type: number }
        unitPriceHt: { type: number }
    OrderSummary:
      type: object
      additionalProperties: false
      required: [id, shopId, source, createdAt, customerName, customerEmail, items, totalHt, totalTtc, status]
      properties:
        id: { type: string }
        shopId: { type: string }
        source: { type: string, enum: [legacy, v1_1] }
        createdAt: { type: string, format: date-time }
        customerName: { type: string }
        customerEmail: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        totalHt: { type: number }
        totalTtc: { type: number }
        status: { type: string }
    OrdersList:
      type: object
      additionalProperties: false
      required: [orders]
      properties:
        orders: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
    PortalOrdersCounters:
      type: object
      additionalProperties: false
      required: [mine, to_validate, to_approve, to_produce]
      properties:
        mine: { type: integer, minimum: 0 }
        to_validate: { type: integer, minimum: 0 }
        to_approve: { type: integer, minimum: 0 }
        to_produce: { type: integer, minimum: 0 }
    PortalOrdersDatasets:
      type: object
      additionalProperties: false
      required: [mine, to_validate, to_approve, to_produce]
      properties:
        mine: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
        to_validate: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
        to_approve: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
        to_produce: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
    PortalOrdersResponse:
      type: object
      additionalProperties: false
      required: [counters, datasets]
      properties:
        counters: { $ref: '#/components/schemas/PortalOrdersCounters' }
        datasets: { $ref: '#/components/schemas/PortalOrdersDatasets' }
    OrderAuditEvent:
      type: object
      additionalProperties: false
      required: [eventId, orderId, kind, eventType, actorId, actorEmail, roleName, payload, occurredAt]
      properties:
        eventId: { type: string }
        orderId: { type: string }
        kind: { type: string, enum: [status, role] }
        eventType: { type: string }
        actorId: { type: [string, 'null'] }
        actorEmail: { type: [string, 'null'] }
        roleName: { type: [string, 'null'] }
        payload: { type: object }
        occurredAt: { type: string, format: date-time }
    OrderAuditTrail:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/OrderAuditEvent' } }
    TransitionOrderCommand:
      type: object
      additionalProperties: false
      required: [toStatus, reason, idempotencyKey]
      properties:
        toStatus:
          type: string
          enum: [validated, in_production, shipped, delivered, invoiced, cancelled]
        reason: { type: [string, 'null'] }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    TransitionOrderResult:
      type: object
      additionalProperties: false
      required: [orderId, fromStatus, toStatus, replayed]
      properties:
        orderId: { type: string }
        fromStatus: { type: string }
        toStatus: { type: string }
        replayed: { type: boolean }
    CreateOrderItem:
      type: object
      additionalProperties: false
      required: [productId, productLabel, clariprintOptions, quantity, unitPriceHt]
      properties:
        productId: { type: [string, 'null'], format: uuid }
        productLabel: { type: string, minLength: 1 }
        clariprintOptions: { type: [object, 'null'] }
        quantity: { type: integer, minimum: 1 }
        unitPriceHt: { type: number, minimum: 0 }
    CreateOrderCommand:
      type: object
      additionalProperties: false
      required: [shopId, currency, notes, items, idempotencyKey]
      properties:
        shopId: { type: string, format: uuid }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        notes: { type: string, maxLength: 5000 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateOrderItem' }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    CreateOrderResult:
      type: object
      additionalProperties: false
      required: [orderId, tenantId, shopId, totalHt, currency, replayed]
      properties:
        orderId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        shopId: { type: string, format: uuid }
        totalHt: { type: number, minimum: 0 }
        currency: { type: string }
        replayed: { type: boolean }
    DraftOrderItem:
      type: object
      additionalProperties: false
      required: [id, productId, productLabel, clariprintOptions, quantity, unitPriceHt, lineTotalHt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: [string, 'null'], format: uuid }
        productLabel: { type: string }
        clariprintOptions: { type: [object, 'null'] }
        quantity: { type: integer, minimum: 1 }
        unitPriceHt: { type: number, minimum: 0 }
        lineTotalHt: { type: number, minimum: 0 }
    DraftOrder:
      type: object
      additionalProperties: false
      required: [orderId, status, createdAt, totalHt, items]
      properties:
        orderId: { type: string, format: uuid }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        totalHt: { type: number, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/DraftOrderItem' }
    UpdateDraftOrderItem:
      type: object
      additionalProperties: false
      required: [id, productLabel, quantity, unitPriceHt]
      properties:
        id: { type: string, format: uuid }
        productLabel: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
        unitPriceHt: { type: number, minimum: 0 }
    UpdateDraftOrderCommand:
      type: object
      additionalProperties: false
      required: [items, idempotencyKey]
      properties:
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/UpdateDraftOrderItem' }
        idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    UpdateDraftOrderResult:
      type: object
      additionalProperties: false
      required: [orderId, totalHt, replayed]
      properties:
        orderId: { type: string, format: uuid }
        totalHt: { type: number, minimum: 0 }
        replayed: { type: boolean }
    OrderCapabilities:
      type: object
      additionalProperties: false
      required: [can_quote, can_order, can_invite, can_validate, can_cancel, can_modify, can_export, can_manage_catalog, can_manage_roles]
      properties:
        can_quote: { type: boolean }
        can_order: { type: boolean }
        can_invite: { type: boolean }
        can_validate: { type: boolean }
        can_cancel: { type: boolean }
        can_modify: { type: boolean }
        can_export: { type: boolean }
        can_manage_catalog: { type: boolean }
        can_manage_roles: { type: boolean }
    OrderRoleAssignment:
      type: object
      additionalProperties: false
      required: [assignmentId, roleDefinitionId, name, capabilities, notifyPolicy, orderingIndex]
      properties:
        assignmentId: { type: string, format: uuid }
        roleDefinitionId: { type: string, format: uuid }
        name: { type: string }
        capabilities: { type: object, additionalProperties: { type: boolean } }
        notifyPolicy: { type: string, enum: [chain_next, all_roles, none] }
        orderingIndex: { type: integer }
    OrderRolesResponse:
      type: object
      additionalProperties: false
      required: [roles, capabilities, isCreator]
      properties:
        roles:
          type: array
          items: { $ref: '#/components/schemas/OrderRoleAssignment' }
        capabilities: { $ref: '#/components/schemas/OrderCapabilities' }
        isCreator: { type: boolean }
    UpdateTenantSettings:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, minLength: 3, maxLength: 60, pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$' }
    TenantMutationResult:
      type: object
      additionalProperties: false
      required: [updated]
      properties:
        updated: { const: true }
    UserCapability:
      type: object
      additionalProperties: false
      required: [capability, granted]
      properties:
        capability: { type: string, pattern: '^can_[a-z0-9_]+$', maxLength: 80 }
        granted: { type: boolean }
    SubTenant:
      type: object
      additionalProperties: false
      required: [id, slug, name, createdAt]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    SubTenantKpi:
      type: object
      additionalProperties: false
      required: [tenantId, tenantName, tenantSlug, createdAt, memberCount, monthOrderCount, monthCaHt]
      properties:
        tenantId: { type: string }
        tenantName: { type: string }
        tenantSlug: { type: string }
        createdAt: { type: string, format: date-time }
        memberCount: { type: integer, minimum: 0 }
        monthOrderCount: { type: integer, minimum: 0 }
        monthCaHt: { type: number, minimum: 0 }
    SubTenantsDashboard:
      type: object
      additionalProperties: false
      required: [subTenants, kpis]
      properties:
        subTenants: { type: array, items: { $ref: '#/components/schemas/SubTenant' } }
        kpis: { type: array, items: { $ref: '#/components/schemas/SubTenantKpi' } }
    CreateSubTenant:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, minLength: 3, maxLength: 60, pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$' }
    CreateSubTenantResult:
      type: object
      additionalProperties: false
      required: [tenantId]
      properties:
        tenantId: { type: string }
    RemoveSubTenantResult:
      type: object
      additionalProperties: false
      required: [removed]
      properties:
        removed: { const: true }
    PimPendingCandidates:
      type: object
      additionalProperties: false
      required: [pendingCount]
      properties:
        pendingCount: { type: integer, minimum: 0 }
    RunPimIngestCommand:
      type: object
      additionalProperties: false
      required: [dryRun]
      properties:
        dryRun: { type: boolean }
    PimIngestReport:
      type: object
      additionalProperties: false
      required: [dryRun, totalCandidates, matched, rejected, enriched, errors]
      properties:
        dryRun: { type: boolean }
        totalCandidates: { type: integer, minimum: 0 }
        matched: { type: array, items: { type: object, additionalProperties: true } }
        rejected: { type: array, items: { type: object, additionalProperties: true } }
        enriched: { type: array, items: { type: object, additionalProperties: true } }
        errors: { type: array, items: { type: object, additionalProperties: true } }
    GeneratePimDefinitionCommand:
      type: object
      additionalProperties: false
      required: [gammeSlug, locale]
      properties:
        gammeSlug: { type: string, minLength: 1, maxLength: 160 }
        gammeName: { type: string, minLength: 1, maxLength: 160 }
        gammeMatchingRules: { type: object, additionalProperties: true }
        locale: { type: string, minLength: 2, maxLength: 12 }
        variationFilter: { type: object, additionalProperties: true, default: {} }
        mode: { type: string, enum: [generate, validate], default: generate }
        existing: { type: object, additionalProperties: true }
    GeneratedPimDefinition:
      type: object
      additionalProperties: false
      required: [generated]
      properties:
        generated: { type: object, additionalProperties: true }
  responses:
    AuthenticationRequired:
      description: Bearer token absent ou invalide
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    InternalError:
      description: Erreur interne corrélée sans détail technique exposé
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
